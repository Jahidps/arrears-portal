<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Paymentsave — Lease Portal</title>
<link rel="icon" href="https://paymentsave.co.uk/wp-content/uploads/2024/05/cropped-fav-icon-270x270.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29abe2; --deep:#1c4e9d; --navy:#0b1f3f;
    --bg:#f5f5f9; --card:#fff; --border:#e7e9f0; --text:#1d2b3f; --muted:#6b7f95;
    --red:#e04f4f; --red-bg:#fdeaea; --green:#189a5c; --green-bg:#e2f6ec;
    --amber:#c07f1d; --amber-bg:#fcf2df; --grey-bg:#eef3f8; --purple:#7048d6; --purple-bg:#f0eafc;
    --shadow:0 1px 3px rgba(11,31,63,.06); --shadow-lg:0 8px 26px rgba(11,31,63,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Poppins","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px}
  button,input,select{font-family:inherit}
  a{color:inherit}

  /* GATE */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  #gate .box{background:var(--card);padding:40px 38px 32px;border-radius:18px;width:384px;max-width:100%;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
  #gate img{height:40px;margin-bottom:18px}
  #gate h1{font-size:15px;color:var(--navy);font-weight:600;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px}
  #gate p{color:var(--muted);font-size:12px;margin-bottom:22px}
  #gate input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;text-align:center;letter-spacing:3px;outline:none}
  #gate input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(41,171,226,.15)}
  #gate button{width:100%;margin-top:14px;padding:13px;background:var(--deep);color:#fff;border:0;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer}
  #gate button:hover{background:#173f80}
  #gate .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

  /* LAYOUT */
  #app{display:none;height:100vh}
  #app.on{display:flex}
  aside{width:242px;min-width:242px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px 16px}
  aside .logo{padding:0 6px 18px;border-bottom:1px solid var(--border);margin-bottom:16px}
  aside .logo img{width:100%;max-width:158px;display:block}
  aside .logo .sub{font-size:9.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:9px;padding-left:2px}
  nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;background:none;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;transition:.15s}
  .navbtn:hover{background:var(--grey-bg);color:var(--navy)}
  .navbtn.active{background:#eef4fb;color:var(--deep);font-weight:600}
  .navtile{width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:none!important}
  .navtile svg{width:18px;height:18px}
  .navbtn:hover .navtile,.navbtn.active .navtile{color:var(--deep)}
  .navbtn .cnt{margin-left:auto;background:var(--grey-bg);color:var(--muted);border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:600}
  .navcaret{margin-left:auto;width:15px;height:15px;opacity:.55;transition:transform .18s}
  .navbtn.exp .navcaret{transform:rotate(90deg);opacity:.9}
  .subnav{display:none;flex-direction:column;gap:1px;margin:1px 0 5px;overflow:hidden}
  .subnav.open{display:flex;animation:subin .18s ease}
  @keyframes subin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .subbtn{position:relative;display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;padding:7px 11px 7px 42px;border-radius:8px;transition:.14s}
  .subbtn:hover{background:var(--grey-bg);color:var(--navy)}
  .subbtn.active{background:#eef4fb;color:var(--deep);font-weight:600}
  .subbtn::before{content:"";position:absolute;left:27px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--border);transition:.14s}
  .subbtn:hover::before{background:var(--muted)}
  .subbtn.active::before{background:var(--deep);box-shadow:0 0 0 3px rgba(28,78,157,.14)}
  .navsep{font-size:9.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px;margin-top:6px;border-top:1px solid var(--border)}
  aside .meta{border-top:1px solid var(--border);padding:14px 8px 2px;font-size:10.5px;color:var(--muted);line-height:1.85}
  aside .meta b{color:var(--navy);font-weight:600}
  main{flex:1;overflow:auto;padding:26px 30px}

  .hero{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
  .hero h2{font-size:20px;font-weight:700;color:var(--navy)}
  .hero .sub{font-size:12px;color:var(--muted);margin:4px 0 16px}
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h2{font-size:20px;font-weight:700;color:var(--navy)}
  .pagehead .desc{font-size:12px;color:var(--muted)}
  .secttl{font-size:13.5px;font-weight:700;color:var(--navy);margin:24px 2px 12px}

  .searchbox{position:relative;max-width:600px}
  .searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  .searchbox input{width:100%;padding:12px 42px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);outline:none}
  .searchbox input:focus{background:var(--card);border-color:var(--sky);box-shadow:0 0 0 3px rgba(41,171,226,.12)}
  .searchbox .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;border-radius:50%;background:var(--grey-bg);color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px}
  .searchbox.has .clr{display:flex}
  .hint{font-size:11px;color:var(--muted);margin-top:8px}

  .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:18px}
  .kpi{border-radius:18px;padding:20px 20px 18px;position:relative;overflow:hidden;color:#fff;box-shadow:0 6px 18px rgba(11,31,63,.16);transition:transform .18s,box-shadow .18s}
  .kpi:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(11,31,63,.26)}
  .kpi .khead{display:flex;justify-content:flex-end;margin-bottom:8px}
  .kpi .ktrend{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.25);color:#fff;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;margin-top:2px}
  .kpi .lab{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.9)}
  .kpi .val{font-size:27px;font-weight:800;color:#fff;margin-top:6px;line-height:1.04;letter-spacing:-.4px}
  .kpi .note{font-size:11.5px;color:rgba(255,255,255,.85);margin-top:6px}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow)}
  .panel h3{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:14px}
  .bizcard{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .bizcard .top{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .bizcard .nm{font-size:18px;font-weight:700;color:var(--navy)}
  .bizcard .mi{font-size:12px;color:var(--muted);margin-top:2px}
  .bizgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
  .bizgrid .f{padding:14px 22px;border-top:1px solid var(--border);border-right:1px solid var(--border)}
  .bizgrid .f .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .bizgrid .f .v{font-size:15px;font-weight:600;color:var(--navy);margin-top:4px}
  .bizcard .sect{padding:11px 22px;border-top:1px solid var(--border);background:#f8fbfe;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--navy)}
  .minirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .minicell{padding:13px 22px;border-top:1px solid var(--border);border-right:1px solid var(--border)}
  .ml{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .mv{font-size:16px;font-weight:700;color:var(--navy);margin-top:3px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .lbtn{padding:8px 13px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--deep);font-weight:600;font-size:12px;cursor:pointer}
  .lbtn:hover{background:var(--grey-bg)}
  .lbtn.xs{padding:4px 10px;font-size:11px;border-radius:7px}
  .lbtn.xs.on{background:#eef4fb;border-color:var(--sky);color:var(--deep)}
  .detrow>td{background:var(--grey-bg);padding:14px 16px!important}
  .detwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 22px;margin-bottom:8px}
  .detf{display:flex;flex-direction:column;border-bottom:1px dashed var(--border);padding-bottom:5px}
  .detl{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .detv{font-size:13px;font-weight:600;color:var(--navy);margin-top:2px;word-break:break-word}

  .tag{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px}
  .t-g{background:var(--green-bg);color:var(--green)} .t-r{background:var(--red-bg);color:var(--red)}
  .t-a{background:var(--amber-bg);color:var(--amber)} .t-n{background:var(--grey-bg);color:var(--muted)}
  .t-b{background:rgba(41,171,226,.14);color:var(--deep)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .stat{font-size:12px;color:var(--muted)}
  select.f{padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);font-size:12.5px;color:var(--text)}

  .tablewrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 300px)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  thead th{position:sticky;top:0;background:var(--grey-bg);color:var(--muted);text-align:left;padding:11px 14px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
  thead th:last-child{border-right:0}
  thead th:hover{color:var(--deep)}
  tbody td{padding:10px 14px;border-top:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  tbody td:last-child{border-right:0}
  tbody tr:hover{background:#f6f9ff}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.arr{color:var(--red);font-weight:600;text-align:right;background:#fdf2f2}
  td.res{background:#eff9f2}
  .clk{color:var(--deep);font-weight:600;cursor:pointer}
  .clk:hover{text-decoration:underline}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px}
  .pager button{padding:7px 15px;border:1px solid var(--border);background:var(--card);border-radius:9px;cursor:pointer;font-size:12px;color:var(--deep)}
  .pager button:disabled{opacity:.4;cursor:default}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:13px}
  .frame{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .frame iframe{display:block;width:100%;height:calc(100vh - 130px);min-height:560px;border:0;background:#fff}
  @media(max-width:880px){aside{display:none}main{padding:16px 14px}}

  /* ===== Paynix-style soft blush sidebar (subtle) ===== */
  aside{background:linear-gradient(180deg,#fdf4f7 0%,#fdf6f8 60%,#fcf3f6 100%);border-right:1px solid #f0dbe3}
  aside .logo{border-bottom-color:#f0dee5}
  aside .logo .sub{color:#a67b8d}
  .navbtn{color:#6f6470;font-weight:500}
  .navbtn:hover{background:rgba(255,255,255,.7);color:#c33a7c}
  .navbtn.active{background:#fff;color:#c33a7c;font-weight:600;box-shadow:0 2px 8px rgba(196,58,124,.12)}
  .navtile{color:#b598a5}
  .navbtn:hover .navtile,.navbtn.active .navtile{color:#c33a7c}
  .navbtn .cnt{background:rgba(255,255,255,.9);color:#a3607f}
  .navbtn.active .cnt{background:#fbe7f0;color:#c02a74}
  .navcaret{color:#a98ea0}
  .navsep{color:#9c8492;border-top-color:#f0dee5}
  .subbtn{color:#7d7280}
  .subbtn:hover{background:rgba(255,255,255,.65);color:#c33a7c}
  .subbtn.active{background:rgba(255,255,255,.95);color:#c33a7c}
  .subbtn::before{background:#ddc3ce}
  .subbtn:hover::before{background:#c33a7c}
  .subbtn.active::before{background:#c33a7c;box-shadow:0 0 0 3px rgba(196,58,124,.13)}
  aside .meta{border-top-color:#f0dee5;color:#8f7a86}
  aside .meta b{color:#b53a72}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <img src="https://paymentsave.co.uk/wp-content/uploads/2024/05/paymentsave-Logo-1024x224.png" alt="Paymentsave">
    <h1>Lease Portal</h1>
    <p>Enter the team passcode to continue</p>
    <input type="password" id="pass" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autofocus>
    <button onclick="checkPass()">Sign in</button>
    <div class="err" id="passErr"></div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="logo">
      <img src="https://paymentsave.co.uk/wp-content/uploads/2024/05/paymentsave-Logo-1024x224.png" alt="Paymentsave">
      <div class="sub">Lease Portal</div>
    </div>
    <nav id="nav"></nav>
    <div class="meta" id="meta"></div>
  </aside>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
/* ===== cache-busting data loader =====
   ver.js is tiny and always fetched fresh (Date.now); the big data file is then
   loaded versioned by APP_VER, so a data update refreshes automatically — no hard
   refresh needed. Falls back to a timestamp if ver.js is missing. */
window.__dataReady=false;
(function(){
  function add(src,cb){var s=document.createElement("script");s.async=false;s.onload=cb;s.onerror=cb;s.src=src;document.head.appendChild(s);}
  add("ver.js?_="+Date.now(),function(){
    var v="?v="+encodeURIComponent(window.APP_VER||String(Date.now()));
    add("lease_data.js"+v,function(){window.__dataReady=true;if(window.__onData)window.__onData();});
  });
})();
</script>
<script>
/* ===== passcode ===== */
const PASS_HASH="cfcba9d06239fed878cf3c855395d79dcd28aedccc924bdb21521c8c663cf64f";
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function checkPass(){
  const v=document.getElementById("pass").value;
  if(await sha256(v)===PASS_HASH){sessionStorage.setItem("psl_auth","1");unlock();}
  else{document.getElementById("passErr").textContent="Incorrect passcode";document.getElementById("pass").value="";}
}
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")checkPass();});
function unlock(){document.getElementById("gate").style.display="none";document.getElementById("app").classList.add("on");safeInit();}
function safeInit(){
  if(window.__dataReady&&window.LEASE){init();return;}
  var m=document.getElementById("main");if(m)m.innerHTML='<div class="empty">Loading data…</div>';
  window.__onData=function(){init();};
}
if(sessionStorage.getItem("psl_auth")==="1")setTimeout(unlock,0);

/* ===== data ===== */
let D=null, ROWS=[], CI={}, byMID={}, LMAP={}, PARTNERS=[], resBack=null;
const MAIN=[
  {k:"dash",  label:"Dashboard",      ic:"M3 13h8V3H3zM3 21h8v-6H3zM13 21h8V11h-8zM13 3v6h8V3z", g:"linear-gradient(135deg,#29abe2,#1c4e9d)"},
  {k:"all",   label:"All Businesses", ic:"M4 4h16v4H4zM4 10h16v4H4zM4 16h16v4H4z", g:"linear-gradient(135deg,#33b1e8,#1a56ad)"},
  {k:"resid", label:"Residual View",   src:"residuals.html", ic:"M4 20h16v-2H6V4H4v16zm3-3h2v-6H7v6zm4 0h2V7h-2v10zm4 0h2v-8h-2v8z", g:"linear-gradient(135deg,#2bbd77,#178a53)",
   subs:[{k:"dash",label:"Dashboard"},{k:"part",label:"Top Partners"},{k:"funding",label:"Funding"},{k:"movers",label:"Biggest Movers"},{k:"analytics",label:"Partner Analytics"},{k:"search",label:"Search"}]},
  {k:"arrears",label:"Arrears View",   src:"arrears.html",   ic:"M12 2L1 21h22L12 2zm0 5l6.9 12H5.1L12 7zm-1 4v3h2v-3h-2zm0 4v2h2v-2h-2z", g:"linear-gradient(135deg,#ef6a6a,#c22f2f)",
   subs:[{k:"dashboard",label:"Dashboard"},{k:"fdgl",label:"FDGL"},{k:"paytek",label:"Paytek"},{k:"ps_lease",label:"PS Lease"},{k:"new_arrears",label:"New Arrears"},{k:"increased",label:"Increased"},{k:"settled",label:"Settled"}]}
];
const TOOLS=[
  {k:"vat",    label:"VAT Schedule",       src:"vat-schedule.html",       ic:"M6 2h8l6 6v14H6V2zm8 1.5V8h4.5L14 3.5zM8 12h8v1.6H8zm0 3.2h8v1.6H8z", g:"linear-gradient(135deg,#7048d6,#4a2fb0)"},
  {k:"invoice",label:"Rental Invoice",     src:"rental-invoice.html",     ic:"M6 2h12v20l-3-2-3 2-3-2-3 2V2zm3 5h6v1.6H9zm0 3.4h6v1.6H9z", g:"linear-gradient(135deg,#1fc8a9,#0d8b71)"},
  {k:"interim",label:"Interim Calculator", src:"interim-calculator.html", ic:"M7 2h10a1 1 0 011 1v18a1 1 0 01-1 1H7a1 1 0 01-1-1V3a1 1 0 011-1zm1 3v3h8V5H8zm0 5h2v2H8zm3 0h2v2h-2zm3 0h2v2h-2zm-6 3h2v2H8zm3 0h2v2h-2zm3 0h2v2h-2z", g:"linear-gradient(135deg,#f2a541,#d96c2c)"}
];
function init(){
  if(D) return;
  D=window.LEASE;
  if(!D){document.getElementById("main").innerHTML='<div class="empty">Could not load lease_data.js.</div>';return;}
  D.cols.forEach((c,i)=>CI[c]=i);
  ROWS=D.rows;
  ROWS.forEach(r=>byMID[String(r[CI.MID])]=r);
  LMAP=D.leaseMap||{};
  PARTNERS=[...new Set(ROWS.map(r=>r[CI.Partner]).filter(Boolean))];
  buildNav(); show("dash");
}

/* ===== helpers ===== */
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const gbp=n=>"£"+Math.round(+n||0).toLocaleString("en-GB");
const gbp2=n=>"£"+(+n||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
function tile(m){return '<span class="navtile">'+(m.ic?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="'+m.ic+'"/></svg>':m.label[0])+'</span>';}
function statusTag(s){const n=String(s).toLowerCase();let c="t-n";if(/open|hold|re-?open|reserve/.test(n))c="t-g";else if(/deactiv|fraud|closed|terminat/.test(n))c="t-r";return '<span class="tag '+c+'">'+esc(s)+'</span>';}
/* months due from commencement date (DD/MM/YYYY) to today — the "To be Paid" count */
function monthsToDate(s){
  const m=String(s==null?"":s).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(!m)return "—";
  let d=+m[1], mo=+m[2], y=+m[3]; if(y<100)y+=2000;
  const t=new Date();
  let n=(t.getFullYear()-y)*12+(t.getMonth()+1-mo)+(t.getDate()>=d?1:0);
  return n>0?n:0;
}
function isActive(row){return row[CI.Active]===1;}

/* ===== nav ===== */
const CARET='<svg class="navcaret" viewBox="0 0 24 24" fill="currentColor"><path d="M9 6l6 6-6 6z"/></svg>';
function buildNav(){
  const nav=document.getElementById("nav");let h="";
  MAIN.forEach(m=>{
    let cnt="";
    if(m.k==="all")cnt='<span class="cnt">'+D.summary.total.toLocaleString()+'</span>';
    if(m.subs){

/* ===== unified search ===== */
function clearSearch(){lastQ="";const q=document.getElementById("q");if(q){q.value="";q.closest(".searchbox").classList.remove("has");}
  const r=document.getElementById("results");if(r)r.innerHTML="";const db=document.getElementById("dashBody");if(db)db.style.display="";}
let sTimer=null;
function onSearch(){clearTimeout(sTimer);sTimer=setTimeout(runSearch,140);}
function runSearch(){
  const inp=document.getElementById("q");if(!inp)return;const q=inp.value.trim();
  inp.closest(".searchbox").classList.toggle("has",!!q);
  lastQ=q; resBack=null;
  const R=document.getElementById("results"),db=document.getElementById("dashBody");
  if(!q){R.innerHTML="";if(db)db.style.display="";return;}
  if(db)db.style.display="none";
  const ql=q.toLowerCase();
  const qd=ql.replace(/[^a-z0-9]/g,"");            // digits/letters only (format-insensitive)
  // ---- 1) exact MID / Lease: jump straight to the business ----
  if(byMID[q]){curBiz={mid:q,expanded:false,back:null};renderBiz();return;}
  let lm=LMAP[q];
  if(!lm){const lk=Object.keys(LMAP).find(k=>k.toLowerCase()===ql); if(lk)lm=LMAP[lk];}
  if(lm&&byMID[lm]){curBiz={mid:lm,expanded:false,back:null};renderBiz();return;}
  // ---- 2) exact partner name ----
  const exactP=PARTNERS.find(n=>n.toLowerCase()===ql);
  if(exactP){openPartner(exactP);return;}
  // ---- 3) smart partial match across MID / Lease No / Legal / Trading / Partner ----
  const pmatch=PARTNERS.filter(n=>n.toLowerCase().includes(ql)).sort().slice(0,25);
  const seen={}, bmatch=[];
  for(let i=0;i<ROWS.length;i++){
    const r=ROWS[i], mid=String(r[CI.MID]); if(seen[mid])continue;
    const midl=mid.toLowerCase(),
          leases=String(r[CI.Leases]==null?"":r[CI.Leases]).toLowerCase(),
          legal=String(r[CI["Legal Name"]]==null?"":r[CI["Legal Name"]]).toLowerCase(),
          trad=String(r[CI["Trading Name"]]==null?"":r[CI["Trading Name"]]).toLowerCase(),
          partner=String(r[CI.Partner]==null?"":r[CI.Partner]).toLowerCase();
    let hit = midl.includes(ql)||leases.includes(ql)||legal.includes(ql)||trad.includes(ql)||partner.includes(ql);
    if(!hit && qd.length>=4){ hit = midl.replace(/[^a-z0-9]/g,"").includes(qd)
                                 || leases.replace(/[^a-z0-9]/g,"").includes(qd); }
    if(hit){ seen[mid]=1; bmatch.push(r); if(bmatch.length>=200)break; }
  }
  // ---- 4) single clean hit -> open it directly ----
  if(pmatch.length===1 && !bmatch.length){openPartner(pmatch[0]);return;}
  if(!pmatch.length && bmatch.length===1){curBiz={mid:String(bmatch[0][CI.MID]),expanded:false,back:null};renderBiz();return;}
  if(!pmatch.length && !bmatch.length){
    R.innerHTML='<div class="bizcard"><div class="empty">No match for &ldquo;'+esc(q)+'&rdquo;. Try a MID, lease number, business name or sales partner — partial is fine.</div></div>';return;
  }
  // ---- 5) show ranked lists ----
  let h='';
  if(pmatch.length){
    h+='<div class="panel"><h3>Sales partners ('+pmatch.length+')</h3><div class="tablewrap" style="max-height:none;box-shadow:none;border:0"><table>'+
      '<thead><tr><th>Sales partner</th><th class="num">Active biz</th><th class="num">Residual</th></tr></thead><tbody>';
    pmatch.forEach(function(n){var pa=(D.partnerActive||[]).find(function(x){return x[0]===n;})||[n,0,0];
      h+='<tr><td class="clk" onclick="gotoPartner(\''+jsq(n)+'\')">'+esc(n)+'</td><td class="num">'+pa[1].toLocaleString()+'</td><td class="num">'+gbp(pa[2])+'</td></tr>';});
    h+='</tbody></table></div></div>';
  }
  if(bmatch.length){
    h+='<div class="panel"><h3>Businesses ('+bmatch.length+(bmatch.length>=200?'+':'')+')</h3><div class="tablewrap" style="max-height:520px;box-shadow:none;border:0"><table>'+
      '<thead><tr><th>MID</th><th>Legal Name</th><th>Trading Name</th><th>Status</th><th class="num">Residual</th><th class="num">Arrears</th></tr></thead><tbody>';
    bmatch.forEach(function(r){h+='<tr><td class="clk" onclick="openMID(\''+jsq(String(r[CI.MID]))+'\')">'+esc(r[CI.MID])+'</td>'+
      '<td>'+esc(r[CI["Legal Name"]]||"—")+'</td><td>'+esc(r[CI["Trading Name"]]||"—")+'</td><td>'+statusTag(r[CI.Status])+'</td>'+
      '<td class="num res">'+(typeof r[CI["Last Residual"]]==="number"?gbp2(r[CI["Last Residual"]]):"—")+'</td><td class="arr">'+(typeof r[CI.Arrears]==="number"?gbp2(r[CI.Arrears]):"")+'</td></tr>';});
    h+='</tbody></table></div></div>';
  }
  R.innerHTML=h;
}

  if(leases.length){
    h+='<div class="tablewrap" style="max-height:none;box-shadow:none;border:0;border-radius:0"><table>'+
      '<thead><tr><th>Lease No</th><th class="num">Arrears</th><th class="num">Contract Pay</th><th class="num">Term</th><th class="num">To be Paid</th><th class="num">Paid</th><th>Commencement</th><th>End Date</th><th>Status</th></tr></thead><tbody>';
    leases.forEach(function(x){h+='<tr><td>'+esc(x[0])+'</td>'+
      '<td class="arr">'+(typeof x[1]==="number"?gbp2(x[1]):"")+'</td>'+
      '<td class="num">'+(typeof x[2]==="number"?gbp2(x[2]):"—")+'</td>'+
      '<td class="num">'+esc(x[6]||"—")+'</td>'+
      '<td class="num">'+monthsToDate(x[4])+'</td>'+
      '<td class="num">'+esc(x[7]||"—")+'</td>'+
      '<td>'+esc(x[4]||"—")+'</td>'+
      '<td>'+esc(x[5]||"—")+'</td>'+
      '<td>'+(x[8]?statusTag(x[8]):"—")+'</td></tr>';});
    h+='</tbody></table></div>';
  } else { h+='<div class="hint" style="padding:10px 22px 16px">No lease or arrears records linked to this MID.</div>'; }
  return h+'</div>';
}

/* ===== All Businesses ===== */
const allState={q:"",status:"",partner:"",sort:-1,dir:1,page:1};
function renderAll(){
  const s=D.summary;
  let h='<div class="pagehead">'+backBtn()+tile(MAIN[1])+'<div><h2>All Businesses</h2><div class="desc">from the MID List · '+s.total.toLocaleString()+' total · cards update with your filter</div></div></div>';
  h+='<div class="kgrid" id="allkpi" style="margin-bottom:18px"></div>';
  // toolbar
  const statuses=Object.keys(s.byStatus).sort();
  const partners=[...new Set(ROWS.map(r=>r[CI.Partner]).filter(Boolean))].sort();
  h+='<div class="toolbar"><div class="searchbox'+(allState.q?' has':'')+'" style="max-width:320px"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>'+
    '<input id="allq" value="'+esc(allState.q)+'" placeholder="Search MID, Lease or name…" oninput="allState.q=this.value;allState.page=1;this.closest(\'.searchbox\').classList.toggle(\'has\',!!this.value);renderAllBody()">'+
    '<button class="clr" onclick="allState.q=\'\';var i=document.getElementById(\'allq\');i.value=\'\';i.closest(\'.searchbox\').classList.remove(\'has\');allState.page=1;renderAllBody()">&times;</button></div>'+
    '<select class="f" onchange="allState.status=this.value;allState.page=1;renderAllBody()"><option value="">All statuses</option><option value="__active">Active only</option><option value="__closed">Closed only</option>'+
    statuses.map(st=>'<option value="'+esc(st)+'">'+esc(st)+' ('+s.byStatus[st]+')</option>').join("")+'</select>'+
    '<select class="f" onchange="allState.partner=this.value;allState.page=1;renderAllBody()"><option value="">All sales partners</option>'+
    partners.map(p=>'<option>'+esc(p)+'</option>').join("")+'</select>'+
    '<span class="stat" id="allstat"></span></div>';
  h+='<div id="allBody"></div>';
  h+=partnerPanel(12);
  document.getElementById("main").innerHTML='<div class="view">'+h+'</div>';
  renderAllBody();
}
const PAGE=100;
function allFiltered(){
  let rows=ROWS;
  const st=allState.status;
  if(st==="__active")rows=rows.filter(isActive);
  else if(st==="__closed")rows=rows.filter(r=>!isActive(r));
  else if(st)rows=rows.filter(r=>String(r[CI.Status])===st);
  if(allState.partner)rows=rows.filter(r=>String(r[CI.Partner])===allState.partner);
  const q=allState.q.trim().toLowerCase();
  if(q)rows=rows.filter(r=>String(r[CI.MID]).includes(q)||String(r[CI["Legal Name"]]).toLowerCase().includes(q)||String(r[CI["Trading Name"]]).toLowerCase().includes(q)||String(r[CI.Partner]).toLowerCase().includes(q)||String(r[CI.Leases]).toLowerCase().includes(q));
  if(allState.sort>-1){const i=allState.sort,d=allState.dir;rows=[...rows].sort((a,b)=>{const x=a[i],y=b[i];if(typeof x==="number"&&typeof y==="number")return(x-y)*d;return String(x).localeCompare(String(y),undefined,{numeric:true})*d;});}
  return rows;
}
const SHOWCOLS=["MID","Status","Legal Name","Trading Name","Partner","First Batch","Last Batch","Last Residual","Arrears"];
function allKPIs(rows){
  const active=rows.filter(isActive).length;
  const closed=rows.length-active;
  const resid=rows.reduce((s,r)=>s+(typeof r[CI["Last Residual"]]==="number"?r[CI["Last Residual"]]:0),0);
  const arrs=rows.reduce((s,r)=>s+(typeof r[CI.Arrears]==="number"?r[CI.Arrears]:0),0);
  const inArr=rows.filter(r=>typeof r[CI.Arrears]==="number"&&r[CI.Arrears]>0.005).length;
  const parts=new Set(rows.map(r=>r[CI.Partner]).filter(Boolean)).size;
  const pct=rows.length?Math.round(active/rows.length*100):0;
  return kpi("blue","Businesses",rows.length.toLocaleString(),"in current view","biz")+
    kpi("green","Active",active.toLocaleString(),pct+"% · open · hold · re-opened · reserve","active")+
    kpi("slate","Closed",closed.toLocaleString(),"deactivated · terminated · closed","closed")+
    kpi("purple","Residual · "+D.meta.residLabel,gbp(resid),"total for this view","money")+
    kpi("red","Total Arrears",gbp(arrs),inArr.toLocaleString()+" in arrears","arr")+
    kpi("teal","Sales Partners",parts.toLocaleString(),"in current view","partners");
}
function renderAllBody(){
  const rows=allFiltered();
  const kb=document.getElementById("allkpi");if(kb)kb.innerHTML=allKPIs(rows);
  const pages=Math.max(1,Math.ceil(rows.length/PAGE));if(allState.page>pages)allState.page=pages;
  const slice=rows.slice((allState.page-1)*PAGE,allState.page*PAGE);
  const st=document.getElementById("allstat");if(st)st.textContent=rows.length.toLocaleString()+" businesses";
  const NC=SHOWCOLS.length+1;
  let h='<div class="tablewrap"><table><thead><tr>';
  SHOWCOLS.forEach(c=>{const i=CI[c];const ar=allState.sort===i?(allState.dir===1?" ▲":" ▼"):"";h+='<th onclick="sortAll('+i+')">'+esc(c)+ar+'</th>';});
  h+='<th></th></tr></thead><tbody>';
  if(!slice.length)h+='<tr><td colspan="'+NC+'"><div class="empty">No matches.</div></td></tr>';
  slice.forEach(r=>{const mid=String(r[CI.MID]);h+='<tr>';SHOWCOLS.forEach(c=>{const i=CI[c],v=r[i];
    if(c==="MID")h+='<td class="clk" onclick="show(\'dash\');setTimeout(()=>{document.getElementById(\'q\').value=\''+r[CI.MID]+'\';runSearch();},30)">'+esc(v)+'</td>';
    else if(c==="Status")h+='<td>'+statusTag(v)+'</td>';
    else if(c==="Last Residual")h+='<td class="num res">'+(typeof v==="number"?gbp2(v):"—")+'</td>';
    else if(c==="Arrears")h+='<td class="arr">'+(typeof v==="number"?gbp2(v):"")+'</td>';
    else if(c==="Partner")h+='<td>'+(v?'<span class="clk" onclick="gotoPartner(\''+jsq(v)+'\')">'+esc(v)+'</span>':'')+'</td>';
    else h+='<td title="'+esc(v)+'">'+esc(v)+'</td>';});
    h+='<td class="num"><button class="lbtn xs" onclick="toggleRow(this)">View more</button></td></tr>';
    h+='<tr class="detrow" style="display:none"><td colspan="'+NC+'">'+rowDetail(r)+'</td></tr>';});
  h+='</tbody></table></div>';
  h+='<div class="pager"><button '+(allState.page<=1?"disabled":"")+' onclick="allState.page--;renderAllBody()">‹ Prev</button><span style="font-size:12px;color:var(--muted)">Page '+allState.page+' of '+pages+'</span><button '+(allState.page>=pages?"disabled":"")+' onclick="allState.page++;renderAllBody()">Next ›</button></div>';
  document.getElementById("allBody").innerHTML=h;
}
function sortAll(i){if(allState.sort===i)allState.dir*=-1;else{allState.sort=i;allState.dir=1;}renderAllBody();}
function toggleRow(btn){var tr=btn.closest("tr").nextElementSibling;if(!tr||!tr.classList.contains("detrow"))return;var open=tr.style.display==="none";tr.style.display=open?"":"none";btn.textContent=open?"View less":"View more";btn.classList.toggle("on",open);}
function rowDetail(r){
  var skip={};SHOWCOLS.forEach(function(c){skip[c]=1;});skip["Active"]=1;skip["Leases"]=1;
  var h='<div class="detwrap">';
  D.cols.forEach(function(c){if(skip[c])return;var v=r[CI[c]];if(v===""||v==null)return;
    h+='<div class="detf"><span class="detl">'+esc(c)+'</span><span class="detv">'+esc(v)+'</span></div>';});
  var mid=String(r[CI.MID]);var dt=(D.detail&&D.detail[mid])||{};
  var ls=(r[CI.Leases]!=null&&r[CI.Leases]!=="")?String(r[CI.Leases]):"";
  if(ls)h+='<div class="detf"><span class="detl">Lease No(s)</span><span class="detv">'+esc(ls)+'</span></div>';
  if(dt.l&&dt.l.length)h+='<div class="detf"><span class="detl">Linked leases</span><span class="detv">'+dt.l.length+' in arrears/estate</span></div>';
  h+='</div><div style="padding:0 4px 4px"><button class="lbtn xs" onclick="show(\'dash\');setTimeout(()=>{document.getElementById(\'q\').value=\''+jsq(mid)+'\';runSearch();},30)">Open full record &rsaquo;</button></div>';
  return h;
}

/* ===== partner analysis (active business by partner) ===== */
function partnerPanel(limit){
  const pa=D.partnerActive||[];if(!pa.length)return"";
  const top=pa.slice(0,limit);const max=Math.max(1,...top.map(p=>p[1]));
  let h='<div class="secttl">Partners by active business</div><div class="panel"><h3 style="margin-bottom:4px">Which partner has the most active businesses</h3>'+
    '<div class="hint" style="margin-bottom:14px">Active MIDs matched to their partner (from the residual datagrid).</div>';
  top.forEach((p,i)=>{h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:11px">'+
    '<div style="width:20px;text-align:right;color:var(--muted);font-weight:700;font-size:11px">'+(i+1)+'</div>'+
    '<div class="clk" style="width:250px;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" onclick="gotoPartner(\''+jsq(p[0])+'\')">'+esc(p[0])+'</div>'+
    '<div style="flex:1;background:var(--grey-bg);border-radius:8px;height:22px"><div style="height:100%;border-radius:8px;width:'+(p[1]/max*100).toFixed(1)+'%;background:linear-gradient(90deg,#2bbd77,#178a53);min-width:3px"></div></div>'+
    '<div style="width:110px;text-align:right;font-weight:600;font-size:12px">'+p[1].toLocaleString()+' active</div></div>';});
  h+='</div>';return h;
}
</script>
