<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PaymentSave Arrears Portal</title>
<style>
  :root{
    --navy:#0f2a4a; --navy2:#163a63; --accent:#2f80ed; --bg:#f4f6fa;
    --card:#ffffff; --border:#e2e8f0; --text:#1a2433; --muted:#64748b;
    --red:#d64545; --green:#1f9d55; --amber:#b7791f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}

  /* ---------- passcode gate ---------- */
  #gate{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:1000}
  #gate .box{background:#fff;padding:36px 32px;border-radius:12px;width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  #gate h1{font-size:18px;color:var(--navy);margin-bottom:4px}
  #gate p{color:var(--muted);font-size:12.5px;margin-bottom:18px}
  #gate input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:15px;text-align:center;letter-spacing:2px}
  #gate button{width:100%;margin-top:12px;padding:10px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  #gate .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

  /* ---------- layout ---------- */
  #app{display:none}
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header .logo{font-size:17px;font-weight:700}
  header .logo span{color:#7db4f5}
  header .meta{margin-left:auto;font-size:11.5px;color:#b9c8dc;text-align:right;line-height:1.5}
  nav{background:var(--navy2);padding:0 14px;display:flex;flex-wrap:wrap}
  nav button{background:none;border:0;color:#c4d3e6;padding:12px 16px;font-size:13.5px;cursor:pointer;border-bottom:3px solid transparent}
  nav button:hover{color:#fff}
  nav button.active{color:#fff;font-weight:600;border-bottom-color:var(--accent)}
  nav button .cnt{background:rgba(255,255,255,.15);border-radius:10px;padding:1px 7px;font-size:11px;margin-left:5px}
  main{padding:20px;max-width:1500px;margin:0 auto}

  /* ---------- dashboard ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:box-shadow .15s}
  .card:hover{box-shadow:0 4px 14px rgba(15,42,74,.12)}
  .card .t{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .card .n{font-size:26px;font-weight:700;color:var(--navy);margin-top:6px}
  .card .s{font-size:12.5px;color:var(--red);margin-top:2px;font-weight:600}
  .searchwrap{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:22px}
  .searchwrap h2{font-size:15px;margin-bottom:10px;color:var(--navy)}
  .searchwrap input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px}
  .searchwrap .hint{font-size:11.5px;color:var(--muted);margin-top:8px}
  #globalResults{margin-top:14px}
  .grp{margin-bottom:16px}
  .grp h3{font-size:13px;color:var(--navy);margin-bottom:6px}
  .grp h3 .more{font-weight:400;color:var(--accent);cursor:pointer;font-size:12px;margin-left:8px}
  .bars{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:22px}
  .bars h2{font-size:15px;color:var(--navy);margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .bar-row .lbl{width:110px;font-size:12.5px;color:var(--muted);text-align:right}
  .bar-row .track{flex:1;background:#edf1f7;border-radius:6px;height:22px;position:relative}
  .bar-row .fill{background:linear-gradient(90deg,var(--accent),#5aa2f7);height:100%;border-radius:6px;min-width:2px}
  .bar-row .val{font-size:12px;font-weight:600;color:var(--navy);width:110px}

  /* ---------- tables ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar input[type=text]{flex:1;min-width:220px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:#fff}
  .toolbar select{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px}
  .toolbar .stat{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .toolbar .stat b{color:var(--red)}
  .tablewrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:calc(100vh - 265px)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
  thead th .arrow{font-size:10px;margin-left:4px;opacity:.85}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:nth-child(even){background:#f8fafd}
  tbody tr:hover{background:#eaf2fd}
  td.money{text-align:right;font-variant-numeric:tabular-nums}
  td.arrears{color:var(--red);font-weight:600;text-align:right}
  .badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block}
  .b-red{background:#fde8e8;color:var(--red)} .b-green{background:#e3f7ec;color:var(--green)}
  .b-amber{background:#fdf3e0;color:var(--amber)} .b-grey{background:#eef1f5;color:var(--muted)}
  .pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:12px}
  .pager button{padding:6px 12px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12.5px}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager span{font-size:12.5px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  #loading{padding:60px;text-align:center;color:var(--muted)}
  @media(max-width:700px){ header .meta{display:none} main{padding:12px} }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>PaymentSave <span style="color:#2f80ed">Arrears Portal</span></h1>
    <p>Enter the team passcode to continue</p>
    <input type="password" id="pass" placeholder="Passcode" autofocus>
    <button onclick="checkPass()">Enter</button>
    <div class="err" id="passErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">PaymentSave <span>Arrears Portal</span></div>
    <div class="meta" id="meta"></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"><div id="loading">Loading data…</div></main>
</div>

<script src="data.js"></script>
<script>
/* ================= PASSCODE ================= */
const PASS_HASH = "260f8baedb27a0588f2a461951d924462158c40a9ad64da44da03c0367072ed4";
/* pure-JS SHA-256 fallback (used when crypto.subtle is unavailable) */
function sha256js(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a));}
  let maxWord=Math.pow(2,32),result="",words=[],asciiBitLength=ascii.length*8;
  let hash=sha256js.h=sha256js.h||[],k=sha256js.k=sha256js.k||[],primeCounter=k.length;
  const isComposite={};
  for(let candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(let i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+="\x80";
  while(ascii.length%64-56)ascii+="\x00";
  for(let i=0;i<ascii.length;i++){
    const j=ascii.charCodeAt(i);
    if(j>>8)return"";
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16),oldHash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2];
      const a=hash[0],e=hash[4];
      const temp1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(let i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){
    const b=(hash[i]>>(j*8))&255;
    result+=((b<16)?0:"")+b.toString(16);
  }
  return result;
}
async function sha256(s){
  if(window.crypto && crypto.subtle){
    try{
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }catch(e){/* fall through */}
  }
  return sha256js(s);
}
async function checkPass(){
  const v = document.getElementById("pass").value;
  if(await sha256(v) === PASS_HASH){
    sessionStorage.setItem("psav_auth","1");
    unlock();
  }else{
    document.getElementById("passErr").textContent = "Incorrect passcode";
    document.getElementById("pass").value = "";
  }
}
document.getElementById("pass").addEventListener("keydown", e=>{ if(e.key==="Enter") checkPass(); });
function unlock(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  init();
}
if(sessionStorage.getItem("psav_auth")==="1") unlock();

/* ================= DATA / STATE ================= */
let DATA = null;
const TAB_ORDER = ["dashboard","fdgl","paytek","ps_lease","ps_team","new_arrears"];
const MONEY_COLS = new Set(["contract payment","paid","arrears","amount"]);
const STATUS_COLS = ["lease status","mandate status","back office stage"];
const state = {}; // per-tab: {q, filter, sortCol, sortDir, page}
let current = "dashboard";

async function init(){
  if(DATA) return;
  if(window.PORTAL_DATA){
    DATA = window.PORTAL_DATA;
  }else{
    try{
      const r = await fetch("data.json?v=" + Date.now());
      DATA = await r.json();
    }catch(e){
      document.getElementById("main").innerHTML = '<div class="empty">Could not load data — make sure data.js sits next to index.html.</div>';
      return;
    }
  }
  const src = DATA.sources||{};
  document.getElementById("meta").innerHTML =
    "Updated: " + DATA.generated +
    (src.del_report ? "<br>Del Report: " + src.del_report.date : "") +
    (src.ps_lease ? " &nbsp;|&nbsp; PS Lease: " + src.ps_lease.date : "");
  buildNav();
  show("dashboard");
}

function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TAB_ORDER.forEach(k=>{
    if(k!=="dashboard" && !DATA.tabs[k]) return;
    const b = document.createElement("button");
    b.dataset.tab = k;
    b.innerHTML = k==="dashboard" ? "Dashboard"
      : DATA.tabs[k].label + '<span class="cnt">' + DATA.tabs[k].rows.length + "</span>";
    b.onclick = ()=>show(k);
    nav.appendChild(b);
  });
}

function show(tab, presetQ){
  current = tab;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  if(tab==="dashboard"){ renderDashboard(); return; }
  if(!state[tab]) state[tab] = {q:"", filter:"", sortCol:-1, sortDir:1, page:1};
  if(presetQ!==undefined){ state[tab].q = presetQ; state[tab].page = 1; }
  renderTable(tab);
}

/* ================= HELPERS ================= */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtMoney = v => (typeof v==="number") ? "£"+v.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}) : esc(v);
function colIdx(tab, names){
  const cols = DATA.tabs[tab].columns.map(c=>c.toLowerCase());
  for(const n of names){ const i = cols.indexOf(n); if(i>-1) return i; }
  return -1;
}
function sumArrears(tab, rows){
  const i = colIdx(tab,["arrears"]);
  if(i<0) return 0;
  return rows.reduce((a,r)=> a + (typeof r[i]==="number" ? r[i] : parseFloat(r[i])||0), 0);
}
function badge(v){
  const s = String(v).toLowerCase();
  let cls = "b-grey";
  if(/default|cancel|closed|terminated|not transacting/.test(s)) cls = "b-red";
  else if(/active|transacting|live|^paid/.test(s)) cls = "b-green";
  else if(/arrears|pending|failed|expired/.test(s)) cls = "b-amber";
  return '<span class="badge '+cls+'">'+esc(v)+"</span>";
}
function filterRows(tab){
  const t = DATA.tabs[tab], st = state[tab];
  const q = st.q.trim().toLowerCase();
  const fIdx = st.filterIdx;
  let rows = t.rows;
  if(st.filter && fIdx>-1) rows = rows.filter(r=>String(r[fIdx])===st.filter);
  if(q) rows = rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q)));
  if(st.sortCol>-1){
    const i = st.sortCol, d = st.sortDir;
    rows = [...rows].sort((a,b)=>{
      const x=a[i], y=b[i];
      const nx = typeof x==="number", ny = typeof y==="number";
      if(nx&&ny) return (x-y)*d;
      return String(x).localeCompare(String(y),undefined,{numeric:true})*d;
    });
  }
  return rows;
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const m = document.getElementById("main");
  const provs = ["fdgl","paytek","ps_lease"].filter(k=>DATA.tabs[k]);
  let totalRows = 0, totalArr = 0;
  const cards = provs.map(k=>{
    const t = DATA.tabs[k], arr = sumArrears(k, t.rows);
    totalRows += t.rows.length; totalArr += arr;
    return {k, label:t.label, n:t.rows.length, arr};
  });
  let html = '<div class="cards">';
  html += card(null, "All providers", totalRows, totalArr);
  cards.forEach(c=> html += card(c.k, c.label, c.n, c.arr));
  if(DATA.tabs.new_arrears)
    html += card("new_arrears", "New in Arrears", DATA.tabs.new_arrears.rows.length, sumArrears("new_arrears", DATA.tabs.new_arrears.rows));
  html += "</div>";

  html += '<div class="searchwrap"><h2>Search everything</h2>' +
    '<input type="text" id="gq" placeholder="Search by MID, name, lease no, email, phone, address, partner — anything…" oninput="globalSearch(this.value)">' +
    '<div class="hint">Searches all tabs and all columns. Click a result group to open the full list in that tab.</div>' +
    '<div id="globalResults"></div></div>';

  const maxArr = Math.max(...cards.map(c=>c.arr), 1);
  html += '<div class="bars"><h2>Total arrears by provider</h2>';
  cards.forEach(c=>{
    html += '<div class="bar-row"><div class="lbl">'+esc(c.label)+'</div>'+
      '<div class="track"><div class="fill" style="width:'+(c.arr/maxArr*100).toFixed(1)+'%"></div></div>'+
      '<div class="val">'+fmtMoney(Math.round(c.arr*100)/100)+'</div></div>';
  });
  html += "</div>";
  m.innerHTML = html;
  const gq = document.getElementById("gq");
  if(state._gq){ gq.value = state._gq; globalSearch(state._gq); }
}
function card(k,label,n,arr){
  return '<div class="card" onclick="'+(k?("show('"+k+"')"):"")+'"><div class="t">'+esc(label)+'</div>'+
    '<div class="n">'+n.toLocaleString()+'</div><div class="s">'+fmtMoney(Math.round(arr*100)/100)+' arrears</div></div>';
}
function globalSearch(q){
  state._gq = q;
  const box = document.getElementById("globalResults");
  q = q.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML=""; return; }
  let html = "", any = false;
  TAB_ORDER.forEach(k=>{
    if(k==="dashboard" || !DATA.tabs[k]) return;
    const t = DATA.tabs[k];
    const hits = t.rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q)));
    if(!hits.length) return;
    any = true;
    html += '<div class="grp"><h3>'+esc(t.label)+' — '+hits.length+' match'+(hits.length>1?"es":"")+
      '<span class="more" onclick="show(\''+k+'\', state._gq)">open in tab →</span></h3>';
    html += miniTable(k, hits.slice(0,5));
    html += "</div>";
  });
  box.innerHTML = any ? html : '<div class="empty">No matches found.</div>';
}
function miniTable(tab, rows){
  const t = DATA.tabs[tab];
  const keep = t.columns.map((c,i)=>({c,i})).filter(o=>
    ["mid","legal name","trading name","lease no.","lease","arrears","lease status","mandate status","paid"].includes(o.c.toLowerCase()));
  let h = '<div class="tablewrap" style="max-height:none"><table><thead><tr>';
  keep.forEach(o=> h += "<th style='cursor:default'>"+esc(o.c)+"</th>");
  h += "</tr></thead><tbody>";
  rows.forEach(r=>{
    h += "<tr>";
    keep.forEach(o=>{
      const name = o.c.toLowerCase(), v = r[o.i];
      if(name==="arrears") h += '<td class="arrears">'+fmtMoney(v)+"</td>";
      else if(MONEY_COLS.has(name)) h += '<td class="money">'+fmtMoney(v)+"</td>";
      else if(STATUS_COLS.includes(name)) h += "<td>"+ (v!==""?badge(v):"") +"</td>";
      else h += "<td>"+esc(v)+"</td>";
    });
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}

/* ================= TABLE TABS ================= */
const PAGE = 50;
function renderTable(tab){
  const t = DATA.tabs[tab], st = state[tab];
  // pick a filterable status column
  st.filterIdx = colIdx(tab, STATUS_COLS);
  const rows = filterRows(tab);
  const pages = Math.max(1, Math.ceil(rows.length/PAGE));
  if(st.page>pages) st.page = pages;
  const slice = rows.slice((st.page-1)*PAGE, st.page*PAGE);
  const arrTotal = sumArrears(tab, rows);

  let html = '<div class="toolbar">'+
    '<input type="text" placeholder="Search '+esc(t.label)+' — any column…" value="'+esc(st.q)+'" oninput="onQ(\''+tab+'\',this.value)">';
  if(st.filterIdx>-1){
    const opts = [...new Set(t.rows.map(r=>String(r[st.filterIdx])).filter(v=>v!==""))].sort();
    html += '<select onchange="onFilter(\''+tab+'\',this.value)"><option value="">'+esc(t.columns[st.filterIdx])+': All</option>'+
      opts.map(o=>'<option '+(st.filter===o?"selected":"")+' value="'+esc(o)+'">'+esc(o)+"</option>").join("")+"</select>";
  }
  html += '<span class="stat">'+rows.length.toLocaleString()+" leases &nbsp;·&nbsp; <b>"+fmtMoney(Math.round(arrTotal*100)/100)+"</b> arrears</span>";
  html += '<button class="exp" style="padding:8px 14px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer" onclick="exportCsv(\''+tab+'\')">Export CSV</button>';
  html += "</div>";

  html += '<div class="tablewrap"><table><thead><tr>';
  t.columns.forEach((c,i)=>{
    const arrow = st.sortCol===i ? (st.sortDir===1?"▲":"▼") : "";
    html += '<th onclick="onSort(\''+tab+'\','+i+')">'+esc(c)+'<span class="arrow">'+arrow+"</span></th>";
  });
  html += "</tr></thead><tbody>";
  if(!slice.length) html += '<tr><td colspan="'+t.columns.length+'"><div class="empty">No matching records.</div></td></tr>';
  slice.forEach(r=>{
    html += "<tr>";
    t.columns.forEach((c,i)=>{
      const name = c.toLowerCase(), v = r[i]===undefined?"":r[i];
      if(name==="arrears") html += '<td class="arrears">'+fmtMoney(v)+"</td>";
      else if(MONEY_COLS.has(name)) html += '<td class="money">'+fmtMoney(v)+"</td>";
      else if(STATUS_COLS.includes(name) && v!=="") html += "<td>"+badge(v)+"</td>";
      else if(name==="email") html += '<td><a href="mailto:'+esc(v)+'">'+esc(v)+"</a></td>";
      else html += "<td title=\""+esc(v)+"\">"+esc(v)+"</td>";
    });
    html += "</tr>";
  });
  html += "</tbody></table></div>";

  html += '<div class="pager">'+
    '<button '+(st.page<=1?"disabled":"")+' onclick="onPage(\''+tab+'\',-1)">‹ Prev</button>'+
    "<span>Page "+st.page+" of "+pages+"</span>"+
    '<button '+(st.page>=pages?"disabled":"")+' onclick="onPage(\''+tab+'\',1)">Next ›</button></div>';

  document.getElementById("main").innerHTML = html;
}
function onQ(tab,v){ state[tab].q=v; state[tab].page=1; renderTableKeepFocus(tab); }
function onFilter(tab,v){ state[tab].filter=v; state[tab].page=1; renderTable(tab); }
function onSort(tab,i){
  const st=state[tab];
  if(st.sortCol===i) st.sortDir*=-1; else {st.sortCol=i; st.sortDir=1;}
  renderTable(tab);
}
function onPage(tab,d){ state[tab].page+=d; renderTable(tab); }
function renderTableKeepFocus(tab){
  renderTable(tab);
  const inp = document.querySelector(".toolbar input");
  if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function exportCsv(tab){
  const t = DATA.tabs[tab];
  const rows = filterRows(tab);
  const csvCell = v => { v = String(v??""); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = [t.columns.map(csvCell).join(",")]
    .concat(rows.map(r=>t.columns.map((_,i)=>csvCell(r[i])).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
  a.download = t.label.replace(/\s+/g,"_") + "_arrears.csv";
  a.click();
}
</script>
</body>
