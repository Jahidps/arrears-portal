<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Paymentsave — Arrears Portal</title>
<link rel="icon" href="https://paymentsave.co.uk/wp-content/uploads/2024/05/cropped-fav-icon-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29abe2; --deep:#1c4e9d; --navy:#10284a;
    --bg:#f2f7fc; --card:#ffffff; --border:#e3ecf5; --text:#1d2b3f; --muted:#6b7f95;
    --red:#e04f4f; --red-bg:#fdeaea; --green:#189a5c; --green-bg:#e2f6ec;
    --amber:#c07f1d; --amber-bg:#fcf2df; --grey-bg:#eef3f8;
    --shadow:0 2px 10px rgba(16,40,74,.06); --shadow-lg:0 10px 30px rgba(16,40,74,.12);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Poppins","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px}
  button{font-family:inherit}
  input,select{font-family:inherit}

  /* ================= PASSCODE GATE ================= */
  #gate{position:fixed;inset:0;background:linear-gradient(135deg,#0e2d5e 0%,#1c4e9d 55%,#29abe2 130%);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  #gate .box{background:#fff;padding:40px 36px 32px;border-radius:20px;width:380px;max-width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  #gate img{height:44px;margin-bottom:14px}
  #gate h1{font-size:16px;color:var(--navy);font-weight:600;margin-bottom:4px}
  #gate p{color:var(--muted);font-size:12px;margin-bottom:20px}
  #gate input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;text-align:center;letter-spacing:3px;outline:none;transition:border-color .15s}
  #gate input:focus{border-color:var(--sky)}
  #gate button{width:100%;margin-top:14px;padding:12px;background:linear-gradient(90deg,var(--sky),var(--deep));color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
  #gate button:hover{opacity:.92}
  #gate .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

  /* ================= LAYOUT ================= */
  #app{display:none;height:100vh}
  #app.on{display:flex}
  aside{width:240px;min-width:240px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px 14px}
  aside .logo{padding:0 8px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
  aside .logo img{width:100%;max-width:180px;display:block}
  aside .logo .sub{font-size:10.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--sky);margin-top:8px;padding-left:2px}
  nav{display:flex;flex-direction:column;gap:4px;flex:1}
  nav .navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;background:none;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;transition:background .12s,color .12s;position:relative}
  nav .navbtn svg{width:18px;height:18px;flex:none}
  nav .navbtn:hover{background:var(--bg);color:var(--navy)}
  nav .navbtn.active{background:linear-gradient(90deg,rgba(41,171,226,.14),rgba(28,78,157,.10));color:var(--deep);font-weight:600}
  nav .navbtn.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--sky),var(--deep))}
  nav .navbtn .cnt{margin-left:auto;background:var(--grey-bg);color:var(--muted);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
  nav .navbtn.active .cnt{background:var(--deep);color:#fff}
  aside .meta{border-top:1px solid var(--border);padding:14px 8px 2px;font-size:10.5px;color:var(--muted);line-height:1.8}
  aside .meta b{color:var(--navy);font-weight:600}

  main{flex:1;overflow:auto;padding:26px 30px}
  .pagehead{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .pagehead h2{font-size:20px;font-weight:600;color:var(--navy)}
  .pagehead .sub{font-size:12px;color:var(--muted)}

  /* ================= SEARCH INPUTS ================= */
  .searchbox{position:relative;flex:1;min-width:230px}
  .searchbox .sicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
  .searchbox input{width:100%;padding:11px 38px 11px 38px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
  .searchbox input:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(41,171,226,.14)}
  .searchbox .clearbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:50%;background:var(--grey-bg);color:var(--muted);font-size:13px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;transition:background .12s,color .12s}
  .searchbox .clearbtn:hover{background:var(--red-bg);color:var(--red)}
  .searchbox.hasval .clearbtn{display:flex}
  .searchbox.big input{padding:14px 44px;font-size:14.5px;border-radius:12px}

  /* ================= DASHBOARD ================= */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,linear-gradient(90deg,var(--sky),var(--deep)))}
  .card .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(41,171,226,.12);color:var(--deep);margin-bottom:10px}
  .card .ic svg{width:17px;height:17px}
  .card .t{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
  .card .n{font-size:24px;font-weight:700;color:var(--navy);margin-top:3px}
  .card .s{font-size:12px;color:var(--red);font-weight:600;margin-top:1px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:22px;box-shadow:var(--shadow)}
  .panel h3{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:14px}
  .hint{font-size:11px;color:var(--muted);margin-top:8px}
  #globalResults{margin-top:16px}
  .grp{margin-bottom:18px}
  .grp h4{font-size:12.5px;color:var(--navy);font-weight:600;margin-bottom:8px}
  .grp h4 .more{font-weight:500;color:var(--sky);cursor:pointer;font-size:11.5px;margin-left:8px}
  .grp h4 .more:hover{text-decoration:underline}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .bar-row .lbl{width:110px;font-size:12px;color:var(--muted);text-align:right;font-weight:500}
  .bar-row .track{flex:1;background:var(--grey-bg);border-radius:8px;height:24px}
  .bar-row .fill{background:linear-gradient(90deg,var(--sky),var(--deep));height:100%;border-radius:8px;min-width:3px;transition:width .4s}
  .bar-row .val{font-size:12px;font-weight:600;color:var(--navy);width:110px}

  /* ================= TOOLBAR ================= */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar select{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:12.5px;color:var(--text);outline:none;cursor:pointer}
  .toolbar select:focus{border-color:var(--sky)}
  .toolbar .stat{font-size:12px;color:var(--muted);white-space:nowrap;padding:0 4px}
  .toolbar .stat b{color:var(--red)}
  .tbtn{padding:10px 15px;border:1.5px solid var(--border);background:#fff;border-radius:10px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:7px;transition:border-color .12s}
  .tbtn:hover{border-color:var(--sky);color:var(--deep)}
  .tbtn svg{width:14px;height:14px}

  /* column picker */
  .colwrap{position:relative}
  .colpanel{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px;z-index:50;width:240px;max-height:320px;overflow:auto}
  .colpanel.open{display:block}
  .colpanel label{display:flex;align-items:center;gap:8px;padding:6px 6px;font-size:12.5px;border-radius:7px;cursor:pointer}
  .colpanel label:hover{background:var(--bg)}
  .colpanel input{accent-color:var(--deep)}
  .colpanel .cp-actions{display:flex;gap:8px;margin-top:8px;border-top:1px solid var(--border);padding-top:10px}
  .colpanel .cp-actions button{flex:1;padding:7px;border:1px solid var(--border);background:#fff;border-radius:8px;font-size:11.5px;cursor:pointer;color:var(--deep);font-weight:500}
  .colpanel .cp-actions button:hover{background:var(--bg)}

  /* ================= TABLES ================= */
  .tablewrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 250px)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:11px 12px;white-space:nowrap;cursor:pointer;user-select:none;z-index:2;font-weight:600;font-size:11.5px;letter-spacing:.3px}
  thead th:hover{background:#1a3a66}
  thead th .arrow{font-size:9px;margin-left:5px;opacity:.9;color:var(--sky)}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:nth-child(even){background:#f8fbfe}
  tbody tr:hover{background:#eaf5fd}
  td.money{text-align:right;font-variant-numeric:tabular-nums}
  td.arrears{color:var(--red);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  td a{color:var(--deep)}
  .badge{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600;display:inline-block}
  .b-red{background:var(--red-bg);color:var(--red)} .b-green{background:var(--green-bg);color:var(--green)}
  .b-amber{background:var(--amber-bg);color:var(--amber)} .b-grey{background:var(--grey-bg);color:var(--muted)}
  .b-blue{background:rgba(41,171,226,.14);color:var(--deep)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:14px}
  .pager button{padding:7px 14px;border:1.5px solid var(--border);background:#fff;border-radius:9px;cursor:pointer;font-size:12px;font-weight:500;color:var(--deep)}
  .pager button:hover:not(:disabled){border-color:var(--sky)}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager span{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:46px 0;font-size:13px}
  #loading{padding:70px;text-align:center;color:var(--muted)}

  /* ================= MOBILE ================= */
  @media(max-width:860px){
    #app.on{flex-direction:column}
    aside{width:100%;min-width:0;flex-direction:row;align-items:center;padding:10px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}
    aside .logo{padding:0;border:0;margin:0;flex:none}
    aside .logo img{max-width:120px}
    aside .logo .sub{display:none}
    nav{flex-direction:row;flex:none}
    nav .navbtn{padding:8px 10px;white-space:nowrap}
    nav .navbtn.active::before{display:none}
    aside .meta{display:none}
    main{padding:16px 14px}
    .tablewrap{max-height:none}
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <img src="https://paymentsave.co.uk/wp-content/uploads/2024/05/paymentsave-Logo-1024x224.png" alt="Paymentsave">
    <h1>Arrears Portal</h1>
    <p>Enter the team passcode to continue</p>
    <input type="password" id="pass" placeholder="••••••••" autofocus>
    <button onclick="checkPass()">Sign in</button>
    <div class="err" id="passErr"></div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="logo">
      <img src="https://paymentsave.co.uk/wp-content/uploads/2024/05/paymentsave-Logo-1024x224.png" alt="Paymentsave">
      <div class="sub">Arrears Portal</div>
    </div>
    <nav id="nav"></nav>
    <div class="meta" id="meta"></div>
  </aside>
  <main id="main"><div id="loading">Loading data…</div></main>
</div>

<script src="data.js"></script>
<script>
/* ================= PASSCODE ================= */
const PASS_HASH = "260f8baedb27a0588f2a461951d924462158c40a9ad64da44da03c0367072ed4";
function sha256js(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a));}
  let maxWord=Math.pow(2,32),result="",words=[],asciiBitLength=ascii.length*8;
  let hash=sha256js.h=sha256js.h||[],k=sha256js.k=sha256js.k||[],primeCounter=k.length;
  const isComposite={};
  for(let candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(let i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+="\x80";
  while(ascii.length%64-56)ascii+="\x00";
  for(let i=0;i<ascii.length;i++){
    const j=ascii.charCodeAt(i);
    if(j>>8)return"";
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16),oldHash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15],w2=w[i-2];
      const a=hash[0],e=hash[4];
      const temp1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const temp2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(let i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){
    const b=(hash[i]>>(j*8))&255;
    result+=((b<16)?0:"")+b.toString(16);
  }
  return result;
}
async function sha256(s){
  if(window.crypto && crypto.subtle){
    try{
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
    }catch(e){}
  }
  return sha256js(s);
}
async function checkPass(){
  const v = document.getElementById("pass").value;
  if(await sha256(v) === PASS_HASH){
    sessionStorage.setItem("psav_auth","1");
    unlock();
  }else{
    document.getElementById("passErr").textContent = "Incorrect passcode";
    document.getElementById("pass").value = "";
  }
}
document.getElementById("pass").addEventListener("keydown", e=>{ if(e.key==="Enter") checkPass(); });
function unlock(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").classList.add("on");
  init();
}
if(sessionStorage.getItem("psav_auth")==="1") unlock();

/* ================= DATA / STATE ================= */
let DATA = null;
const TAB_ORDER = ["dashboard","fdgl","paytek","ps_lease","new_arrears"];
const MONEY_COLS = new Set(["contract payment","paid","arrears","amount"]);
const STATUS_COLS = ["lease status","mandate status","back office stage"];
/* columns hidden by default on wide tabs — everything stays searchable */
const DEFAULT_HIDDEN = new Set(["term","business number","address","buyback","amount","pm","partner's email"]);
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  fdgl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  paytek:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 18h6"/></svg>',
  ps_lease:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  new_arrears:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  cols:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>',
  export:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>',
  pound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 16H9m0 0c1-1 1.5-2.2 1.5-4A3.5 3.5 0 0 1 14 8.6M8.5 12H13"/></svg>'
};
const state = {};
let current = "dashboard";

async function init(){
  if(DATA) return;
  if(window.PORTAL_DATA){
    DATA = window.PORTAL_DATA;
  }else{
    try{
      const r = await fetch("data.json?v=" + Date.now());
      DATA = await r.json();
    }catch(e){
      document.getElementById("main").innerHTML = '<div class="empty">Could not load data — make sure data.js sits next to index.html.</div>';
      return;
    }
  }
  const src = DATA.sources||{};
  document.getElementById("meta").innerHTML =
    "<b>Data updated</b><br>" + DATA.generated +
    (src.del_report ? "<br>Del Report: <b>" + src.del_report.date + "</b>" : "") +
    (src.ps_lease ? "<br>PS Lease: <b>" + src.ps_lease.date + "</b>" : "");
  buildNav();
  show("dashboard");
}

function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TAB_ORDER.forEach(k=>{
    if(k!=="dashboard" && !DATA.tabs[k]) return;
    const b = document.createElement("button");
    b.className = "navbtn";
    b.dataset.tab = k;
    b.innerHTML = (ICONS[k]||"") + "<span>" + (k==="dashboard" ? "Dashboard" : esc(DATA.tabs[k].label)) + "</span>" +
      (k==="dashboard" ? "" : '<span class="cnt">' + DATA.tabs[k].rows.length + "</span>");
    b.onclick = ()=>show(k);
    nav.appendChild(b);
  });
}

function show(tab, presetQ){
  current = tab;
  document.querySelectorAll("nav .navbtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  if(tab==="dashboard"){ renderDashboard(); return; }
  if(!state[tab]) state[tab] = {q:"", filter:"", team:"", sortCol:-1, sortDir:1, page:1, colVis:loadCols(tab)};
  if(presetQ!==undefined){ state[tab].q = presetQ; state[tab].page = 1; }
  renderTable(tab);
}

/* ================= HELPERS ================= */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtMoney = v => (typeof v==="number") ? "£"+v.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}) : esc(v);
function colIdx(tab, names){
  const cols = DATA.tabs[tab].columns.map(c=>c.toLowerCase());
  for(const n of names){ const i = cols.indexOf(n); if(i>-1) return i; }
  return -1;
}
function sumArrears(tab, rows){
  const i = colIdx(tab,["arrears"]);
  if(i<0) return 0;
  return rows.reduce((a,r)=> a + (typeof r[i]==="number" ? r[i] : parseFloat(r[i])||0), 0);
}
function badge(v){
  const s = String(v).toLowerCase();
  let cls = "b-grey";
  if(s==="yes") cls = "b-blue";
  else if(/default|cancel|closed|terminated|not transacting/.test(s)) cls = "b-red";
  else if(/active|transacting|live|^paid/.test(s)) cls = "b-green";
  else if(/arrears|pending|failed|expired/.test(s)) cls = "b-amber";
  return '<span class="badge '+cls+'">'+esc(v)+"</span>";
}
function loadCols(tab){
  try{
    const saved = localStorage.getItem("psav_cols_"+tab);
    if(saved) return new Set(JSON.parse(saved));
  }catch(e){}
  const cols = DATA.tabs[tab].columns;
  const vis = new Set();
  cols.forEach((c,i)=>{ if(!DEFAULT_HIDDEN.has(c.toLowerCase())) vis.add(i); });
  return vis;
}
function saveCols(tab){
  try{ localStorage.setItem("psav_cols_"+tab, JSON.stringify([...state[tab].colVis])); }catch(e){}
}
function filterRows(tab){
  const t = DATA.tabs[tab], st = state[tab];
  const q = st.q.trim().toLowerCase();
  let rows = t.rows;
  if(st.filter && st.filterIdx>-1) rows = rows.filter(r=>String(r[st.filterIdx])===st.filter);
  if(st.team && st.teamIdx>-1) rows = rows.filter(r=> st.team==="Yes" ? String(r[st.teamIdx])==="Yes" : String(r[st.teamIdx])!=="Yes");
  if(q) rows = rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q))); // search ALL columns, hidden included
  if(st.sortCol>-1){
    const i = st.sortCol, d = st.sortDir;
    rows = [...rows].sort((a,b)=>{
      const x=a[i], y=b[i];
      if(typeof x==="number" && typeof y==="number") return (x-y)*d;
      return String(x).localeCompare(String(y),undefined,{numeric:true})*d;
    });
  }
  return rows;
}
function searchBox(id, val, oninput, big, ph){
  return '<div class="searchbox'+(big?' big':'')+(val?' hasval':'')+'" id="sb_'+id+'">'+
    ICONS.search.replace('<svg','<svg class="sicon"')+
    '<input type="text" id="in_'+id+'" placeholder="'+esc(ph)+'" value="'+esc(val)+'" oninput="'+oninput+'">'+
    '<button class="clearbtn" title="Clear" onclick="clearSearch(\''+id+'\')">✕</button></div>';
}
function clearSearch(id){
  const inp = document.getElementById("in_"+id);
  inp.value = "";
  inp.dispatchEvent(new Event("input"));
  inp.focus();
}
function syncClear(id){
  const sb = document.getElementById("sb_"+id);
  if(sb) sb.classList.toggle("hasval", document.getElementById("in_"+id).value.length>0);
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const m = document.getElementById("main");
  const provs = ["fdgl","paytek","ps_lease"].filter(k=>DATA.tabs[k]);
  let totalRows = 0, totalArr = 0;
  const cards = provs.map(k=>{
    const t = DATA.tabs[k], arr = sumArrears(k, t.rows);
    totalRows += t.rows.length; totalArr += arr;
    return {k, label:t.label, n:t.rows.length, arr};
  });
  let html = '<div class="pagehead"><h2>Dashboard</h2><span class="sub">Arrears overview across all lease providers</span></div>';
  html += '<div class="cards">';
  html += card(null, "All providers", totalRows, totalArr);
  cards.forEach(c=> html += card(c.k, c.label, c.n, c.arr));
  if(DATA.tabs.new_arrears)
    html += card("new_arrears", "New in Arrears", DATA.tabs.new_arrears.rows.length, sumArrears("new_arrears", DATA.tabs.new_arrears.rows));
  html += "</div>";

  html += '<div class="panel"><h3>Search everything</h3>'+
    searchBox("global", state._gq||"", "onGlobal(this.value)", true, "Search by MID, name, lease no, email, phone, address, partner — anything…")+
    '<div class="hint">Searches every tab and every column (including hidden ones). Click “open in tab” to see the full list.</div>'+
    '<div id="globalResults"></div></div>';

  const maxArr = Math.max(...cards.map(c=>c.arr), 1);
  html += '<div class="panel"><h3>Total arrears by provider</h3>';
  cards.forEach(c=>{
    html += '<div class="bar-row"><div class="lbl">'+esc(c.label)+'</div>'+
      '<div class="track"><div class="fill" style="width:'+(c.arr/maxArr*100).toFixed(1)+'%"></div></div>'+
      '<div class="val">'+fmtMoney(Math.round(c.arr*100)/100)+'</div></div>';
  });
  html += "</div>";
  m.innerHTML = html;
  if(state._gq) globalSearch(state._gq);
}
function card(k,label,n,arr){
  return '<div class="card" onclick="'+(k?("show('"+k+"')"):"")+'">'+
    '<div class="ic">'+(ICONS[k]||ICONS.pound)+'</div>'+
    '<div class="t">'+esc(label)+'</div>'+
    '<div class="n">'+n.toLocaleString()+'</div>'+
    '<div class="s">'+fmtMoney(Math.round(arr*100)/100)+' arrears</div></div>';
}
function onGlobal(v){ state._gq = v; syncClear("global"); globalSearch(v); }
function globalSearch(q){
  const box = document.getElementById("globalResults");
  q = q.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML=""; return; }
  let html = "", any = false;
  TAB_ORDER.forEach(k=>{
    if(k==="dashboard" || !DATA.tabs[k]) return;
    const t = DATA.tabs[k];
    const hits = t.rows.filter(r=>r.some(c=>String(c).toLowerCase().includes(q)));
    if(!hits.length) return;
    any = true;
    html += '<div class="grp"><h4>'+esc(t.label)+' — '+hits.length+' match'+(hits.length>1?"es":"")+
      '<span class="more" onclick="show(\''+k+'\', state._gq)">open in tab →</span></h4>';
    html += miniTable(k, hits.slice(0,5));
    html += "</div>";
  });
  box.innerHTML = any ? html : '<div class="empty">No matches found.</div>';
}
function miniTable(tab, rows){
  const t = DATA.tabs[tab];
  const keep = t.columns.map((c,i)=>({c,i})).filter(o=>
    ["mid","legal name","trading name","lease no.","lease","arrears","lease status","mandate status","paid","ps team"].includes(o.c.toLowerCase()));
  let h = '<div class="tablewrap" style="max-height:none;box-shadow:none"><table><thead><tr>';
  keep.forEach(o=> h += "<th style='cursor:default'>"+esc(o.c)+"</th>");
  h += "</tr></thead><tbody>";
  rows.forEach(r=>{
    h += "<tr>";
    keep.forEach(o=>{
      const name = o.c.toLowerCase(), v = r[o.i]===undefined?"":r[o.i];
      if(name==="arrears") h += '<td class="arrears">'+fmtMoney(v)+"</td>";
      else if(MONEY_COLS.has(name)) h += '<td class="money">'+fmtMoney(v)+"</td>";
      else if(STATUS_COLS.includes(name)||name==="ps team") h += "<td>"+ (v!==""?badge(v):"") +"</td>";
      else h += "<td>"+esc(v)+"</td>";
    });
    h += "</tr>";
  });
  return h + "</tbody></table></div>";
}

/* ================= TABLE TABS ================= */
const PAGE = 50;
function renderTable(tab){
  const t = DATA.tabs[tab], st = state[tab];
  st.filterIdx = colIdx(tab, STATUS_COLS);
  st.teamIdx = colIdx(tab, ["ps team"]);
  const rows = filterRows(tab);
  const pages = Math.max(1, Math.ceil(rows.length/PAGE));
  if(st.page>pages) st.page = pages;
  const slice = rows.slice((st.page-1)*PAGE, st.page*PAGE);
  const arrTotal = sumArrears(tab, rows);
  const visCols = t.columns.map((c,i)=>({c,i})).filter(o=>st.colVis.has(o.i));

  let html = '<div class="pagehead"><h2>'+esc(t.label)+'</h2><span class="sub">'+t.rows.length.toLocaleString()+' leases in total</span></div>';
  html += '<div class="toolbar">'+
    searchBox(tab, st.q, "onQ('"+tab+"',this.value)", false, "Search "+t.label+" — any column…");
  if(st.filterIdx>-1){
    const opts = [...new Set(t.rows.map(r=>String(r[st.filterIdx])).filter(v=>v!==""))].sort();
    html += '<select onchange="onFilter(\''+tab+'\',this.value)"><option value="">'+esc(t.columns[st.filterIdx])+': All</option>'+
      opts.map(o=>'<option '+(st.filter===o?"selected":"")+' value="'+esc(o)+'">'+esc(o)+"</option>").join("")+"</select>";
  }
  if(st.teamIdx>-1){
    html += '<select onchange="onTeam(\''+tab+'\',this.value)"><option value="">PS Team: All</option>'+
      '<option value="Yes"'+(st.team==="Yes"?" selected":"")+'>PS Team only</option>'+
      '<option value="No"'+(st.team==="No"?" selected":"")+'>Exclude PS Team</option></select>';
  }
  html += '<span class="stat">'+rows.length.toLocaleString()+" leases · <b>"+fmtMoney(Math.round(arrTotal*100)/100)+"</b></span>";
  html += '<div class="colwrap"><button class="tbtn" onclick="toggleCols(event)">'+ICONS.cols+'Columns</button>'+
    '<div class="colpanel" id="colpanel">'+
      t.columns.map((c,i)=>'<label><input type="checkbox" '+(st.colVis.has(i)?"checked":"")+' onchange="onColToggle(\''+tab+'\','+i+',this.checked)"> '+esc(c)+"</label>").join("")+
      '<div class="cp-actions"><button onclick="colsAll(\''+tab+'\',true)">Show all</button><button onclick="colsAll(\''+tab+'\',false)">Reset</button></div>'+
    "</div></div>";
  html += '<button class="tbtn" onclick="exportCsv(\''+tab+'\')">'+ICONS.export+'Export</button>';
  html += "</div>";

  html += '<div class="tablewrap"><table><thead><tr>';
  visCols.forEach(o=>{
    const arrow = st.sortCol===o.i ? (st.sortDir===1?"▲":"▼") : "";
    html += '<th onclick="onSort(\''+tab+'\','+o.i+')">'+esc(o.c)+'<span class="arrow">'+arrow+"</span></th>";
  });
  html += "</tr></thead><tbody>";
  if(!slice.length) html += '<tr><td colspan="'+visCols.length+'"><div class="empty">No matching records.</div></td></tr>';
  slice.forEach(r=>{
    html += "<tr>";
    visCols.forEach(o=>{
      const name = o.c.toLowerCase(), v = r[o.i]===undefined?"":r[o.i];
      if(name==="arrears") html += '<td class="arrears">'+fmtMoney(v)+"</td>";
      else if(MONEY_COLS.has(name)) html += '<td class="money">'+fmtMoney(v)+"</td>";
      else if((STATUS_COLS.includes(name)||name==="ps team") && v!=="") html += "<td>"+badge(v)+"</td>";
      else if(name==="email") html += '<td><a href="mailto:'+esc(v)+'">'+esc(v)+"</a></td>";
      else html += "<td title=\""+esc(v)+"\">"+esc(v)+"</td>";
    });
    html += "</tr>";
  });
  html += "</tbody></table></div>";

  html += '<div class="pager">'+
    '<button '+(st.page<=1?"disabled":"")+' onclick="onPage(\''+tab+'\',-1)">‹ Prev</button>'+
    "<span>Page "+st.page+" of "+pages+"</span>"+
    '<button '+(st.page>=pages?"disabled":"")+' onclick="onPage(\''+tab+'\',1)">Next ›</button></div>';

  document.getElementById("main").innerHTML = html;
}
function onQ(tab,v){ state[tab].q=v; state[tab].page=1; renderTableKeepFocus(tab); }
function onFilter(tab,v){ state[tab].filter=v; state[tab].page=1; renderTable(tab); }
function onTeam(tab,v){ state[tab].team=v; state[tab].page=1; renderTable(tab); }
function onSort(tab,i){
  const st=state[tab];
  if(st.sortCol===i) st.sortDir*=-1; else {st.sortCol=i; st.sortDir=1;}
  renderTable(tab);
}
function onPage(tab,d){ state[tab].page+=d; renderTable(tab); }
function renderTableKeepFocus(tab){
  renderTable(tab);
  const inp = document.getElementById("in_"+tab);
  if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}
function toggleCols(e){
  e.stopPropagation();
  document.getElementById("colpanel").classList.toggle("open");
}
document.addEventListener("click", e=>{
  const p = document.getElementById("colpanel");
  if(p && p.classList.contains("open") && !e.target.closest(".colwrap")) p.classList.remove("open");
});
function onColToggle(tab,i,on){
  const st = state[tab];
  if(on) st.colVis.add(i); else st.colVis.delete(i);
  if(st.colVis.size===0) st.colVis.add(i);
  saveCols(tab);
  renderTable(tab);
  document.getElementById("colpanel").classList.add("open");
}
function colsAll(tab,all){
  const st = state[tab], cols = DATA.tabs[tab].columns;
  st.colVis = new Set();
  cols.forEach((c,i)=>{ if(all || !DEFAULT_HIDDEN.has(c.toLowerCase())) st.colVis.add(i); });
  saveCols(tab);
  renderTable(tab);
  document.getElementById("colpanel").classList.add("open");
}
function exportCsv(tab){
  const t = DATA.tabs[tab];
  const rows = filterRows(tab);
  const csvCell = v => { v = String(v??""); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = [t.columns.map(csvCell).join(",")]
    .concat(rows.map(r=>t.columns.map((_,i)=>csvCell(r[i])).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
  a.download = t.label.replace(/\s+/g,"_") + "_arrears.csv";
  a.click();
}
</script>
