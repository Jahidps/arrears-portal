<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interim Rental Calculator — Paymentsave</title>
<style>
  :root {
    color-scheme: light;
    --brand: #1ba8e0;
    --brand-deep: #0b6fb8;
    --brand-dark: #0a3a63;
    --ink: #0f2233;
    --muted: #5b6b7a;
    --line: #e4ebf1;
    --bg: #eef3f8;
    --card: #ffffff;
    --soft: #f3f8fc;
    --danger: #d92d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -200px, #dcebf7 0%, var(--bg) 60%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 500px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(10, 58, 99, 0.16);
  }
  .header {
    background: #ffffff;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .header img { height: 38px; width: auto; display: block; }
  .title-wrap { padding: 26px 28px 0; }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--ink);
  }
  .subtitle { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  form { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  label { display: flex; flex-direction: column; gap: 6px; }
  .lbl {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: var(--muted);
    text-transform: uppercase;
  }
  input {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 15px;
    outline: none;
    width: 100%;
    font-family: inherit;
    transition: border 0.18s, box-shadow 0.18s;
  }
  input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(27, 168, 224, 0.15);
  }
  .amount { position: relative; }
  .amount .pound {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 15px; pointer-events: none;
  }
  .amount input { padding-left: 30px; }
  .error {
    background: rgba(217, 45, 45, 0.07);
    border: 1px solid rgba(217, 45, 45, 0.25);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--danger);
    font-size: 13px;
  }
  .hidden { display: none; }
  .buttons { display: flex; gap: 10px; margin-top: 4px; }
  button { font-family: inherit; cursor: pointer; border-radius: 10px; font-weight: 600; }
  .btn-calc {
    flex: 1; padding: 13px; border: none;
    background: linear-gradient(100deg, var(--brand-deep), var(--brand));
    color: #fff; font-size: 15px;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 8px 20px rgba(11, 111, 184, 0.28);
  }
  .btn-calc:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(11, 111, 184, 0.36); }
  .btn-calc:active { transform: translateY(0); }
  .btn-reset {
    padding: 13px 20px; background: #fff; border: 1px solid var(--line);
    color: var(--muted); font-size: 15px; font-weight: 500; white-space: nowrap;
    transition: background 0.2s, color 0.2s, border 0.2s;
  }
  .btn-reset:hover { background: var(--soft); color: var(--ink); border-color: var(--brand); }
  .result {
    margin-top: 4px;
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .result-head {
    padding: 10px 16px;
    background: rgba(27, 168, 224, 0.1);
    border-bottom: 1px solid var(--line);
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--brand-deep);
  }
  .result-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .row .k { color: var(--muted); font-size: 13px; }
  .row .v { color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; font-family: "Courier New", monospace; }
  .total-row {
    margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .total-row .k { font-size: 15px; font-weight: 700; color: var(--ink); }
  .total-row .v { font-size: 24px; font-weight: 800; color: var(--brand-deep); font-family: "Courier New", monospace; }
  .footer {
    padding: 14px 28px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11.5px;
  }
  .footer .dev { color: var(--muted); font-weight: 600; }
  .footer a { color: var(--brand-deep); text-decoration: none; font-weight: 600; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>

    <div class="title-wrap">
      <h1>Interim Rental Calculator</h1>
    </div>

    <form onsubmit="return false;">
      <label>
        <span class="lbl">Start Date</span>
        <input type="date" id="startDate">
      </label>
      <label>
        <span class="lbl">End Date</span>
        <input type="date" id="endDate">
      </label>
      <label>
        <span class="lbl">Monthly Rental Amount (£)</span>
        <div class="amount">
          <span class="pound">£</span>
          <input type="number" id="rentalAmount" min="0" step="0.01" placeholder="0.00">
        </div>
      </label>

      <div class="error hidden" id="error"></div>

      <div class="buttons">
        <button type="button" class="btn-calc" id="calcBtn">Calculate</button>
        <button type="button" class="btn-reset" id="resetBtn">↺ Reset</button>
      </div>

      <div class="result hidden" id="result">
        <div class="result-head">Breakdown</div>
        <div class="result-body" id="resultBody"></div>
      </div>
    </form>

    <div class="footer">
      <span class="dev">Developed by Finance Team</span>
      <a href="https://paymentsave.co.uk" target="_blank" rel="noreferrer">paymentsave.co.uk ↗</a>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const daysInMonth = (m, y) => new Date(y, m, 0).getDate(); // m = 1-12
  const fmt = n => new Intl.NumberFormat("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

  function showError(msg) {
    const e = $("error");
    e.textContent = msg;
    e.classList.remove("hidden");
    $("result").classList.add("hidden");
  }

  function calculate() {
    $("error").classList.add("hidden");
    const sv = $("startDate").value, ev = $("endDate").value, av = $("rentalAmount").value;
    if (!sv || !ev || av === "") return showError("Please fill in all fields.");

    const start = new Date(sv), end = new Date(ev);
    if (end <= start) return showError("End date must be after start date.");

    const amount = parseFloat(av);
    if (isNaN(amount) || amount <= 0) return showError("Please enter a valid rental amount.");

    const endMonth = end.getMonth() + 1;
    const endYear = end.getFullYear();
    const dim = daysInMonth(endMonth, endYear);
    const diffDays = Math.round((end - start) / 86400000);
    const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
    const dailyRate = r2(amount / dim);        // per-day rate rounded to 2 decimals first
    const interim = r2(dailyRate * diffDays);  // then multiply by the day count
    const vat = r2(interim * 0.2);
    const total = r2(interim + vat);

    const rows = [
      [`Days in ${months[endMonth-1]} ${endYear}`, `${dim} days`],
      ["Days between dates", `${diffDays} days`],
      ["Daily rate", `£${fmt(dailyRate)}`],
      ["Interim rental (ex. VAT)", `£${fmt(interim)}`],
      ["VAT @ 20%", `£${fmt(vat)}`],
    ];
    $("resultBody").innerHTML =
      rows.map(([k,v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("") +
      `<div class="total-row"><span class="k">Total (inc. VAT)</span><span class="v">£${fmt(total)}</span></div>`;
    $("result").classList.remove("hidden");
  }

  function reset() {
    $("startDate").value = "";
    $("endDate").value = "";
    $("rentalAmount").value = "";
    $("error").classList.add("hidden");
    $("result").classList.add("hidden");
  }

  $("calcBtn").addEventListener("click", calculate);
  $("resetBtn").addEventListener("click", reset);
</script>
