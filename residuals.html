<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Paymentsave — Residual View</title>
<link rel="icon" href="https://paymentsave.co.uk/wp-content/uploads/2024/05/cropped-fav-icon-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#29abe2; --deep:#1c4e9d; --navy:#0b1f3f;
    --bg:#f3f7fc; --card:#ffffff; --border:#e4ecf6; --text:#1d2b3f; --muted:#6b7f95;
    --red:#e04f4f; --red-bg:#fdeaea; --green:#189a5c; --green-bg:#e2f6ec;
    --amber:#c07f1d; --amber-bg:#fcf2df; --grey-bg:#eef3f8;
    --purple:#7048d6; --purple-bg:#f0eafc;
    --bg:#f7f9fc;
    --shadow:0 1px 3px rgba(11,31,63,.06); --shadow-lg:0 8px 26px rgba(11,31,63,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Poppins","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px}
  button,input,select{font-family:inherit}
  a{color:inherit}

  /* ===== GATE ===== */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  #gate .box{position:relative;background:var(--card);padding:40px 38px 32px;border-radius:18px;width:380px;max-width:100%;text-align:center;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
  #gate img{height:38px;margin-bottom:18px}
  #gate h1{font-size:15px;color:var(--navy);font-weight:600;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:6px}
  #gate p{color:var(--muted);font-size:12px;margin-bottom:22px}
  #gate input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:15px;text-align:center;letter-spacing:3px;outline:none;transition:.15s}
  #gate input:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(41,171,226,.15)}
  #gate button{width:100%;margin-top:14px;padding:13px;background:var(--deep);color:#fff;border:0;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  #gate button:hover{background:#173f80}
  #gate button:hover{transform:translateY(-1px)}
  #gate .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

  /* ===== LAYOUT ===== */
  #app{display:none;height:100vh}
  #app.on{display:flex}
  aside{width:238px;min-width:238px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px 16px;position:relative}
  aside .logo{padding:0 6px 18px;border-bottom:1px solid var(--border);margin-bottom:16px;position:relative}
  aside .logo img{width:100%;max-width:150px;display:block}
  aside .logo .sub{font-size:9.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:9px;padding-left:2px}
  nav{display:flex;flex-direction:column;gap:3px;flex:1;position:relative}
  .navbtn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;background:none;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;text-align:left;transition:.15s;position:relative}
  .navbtn:hover{background:var(--grey-bg);color:var(--navy)}
  .navbtn.active{background:#eef4fb;color:var(--deep);font-weight:600}
  .navtile{width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;background:none!important}
  .navbtn:hover .navtile,.navbtn.active .navtile{color:var(--deep)}
  .navtile svg{width:18px;height:18px}
  .navbtn .cnt{margin-left:auto;background:var(--grey-bg);color:var(--muted);border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:600}
  .navbtn.active .cnt{background:var(--sky);color:#fff}
  aside .meta{border-top:1px solid var(--border);padding:14px 8px 2px;font-size:10.5px;color:var(--muted);line-height:1.9;position:relative}
  aside .meta b{color:var(--navy);font-weight:600}
  main{flex:1;overflow:auto;padding:26px 30px}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .view{animation:fadein .28s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

  /* tooltip */
  .info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--grey-bg);color:var(--muted);font-size:10px;font-weight:700;cursor:help;margin-left:5px;position:relative;vertical-align:middle}
  .kpi .info{background:rgba(255,255,255,.28);color:#fff}
  .info:hover::after{content:attr(data-tip);position:absolute;bottom:140%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:11px;font-weight:500;line-height:1.5;padding:9px 12px;border-radius:9px;width:230px;box-shadow:0 10px 30px rgba(11,31,63,.35);z-index:50;text-align:left;letter-spacing:0;text-transform:none}
  .info:hover::before{content:"";position:absolute;bottom:140%;left:50%;transform:translate(-50%,60%) rotate(45deg);width:9px;height:9px;background:var(--navy);z-index:50}

  /* ===== HERO ===== */
  .hero{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;color:var(--text);position:relative;margin-bottom:20px}
  .hero h2{font-size:19px;font-weight:700;position:relative;color:var(--navy)}
  .hero .sub{font-size:12px;color:var(--muted);margin:4px 0 18px;position:relative}
  .searchbox{position:relative;max-width:560px}
  .searchbox svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
  .searchbox input{width:100%;padding:12px 44px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--bg);transition:.15s}
  .searchbox input:focus{border-color:var(--sky);background:var(--card);box-shadow:0 0 0 3px rgba(41,171,226,.12)}
  .searchhint{font-size:11px;color:var(--muted);margin-top:9px;position:relative}
  .clearbtn{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--grey-bg);color:var(--muted);border:0;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px;line-height:1;padding:0;transition:.15s;z-index:2}
  .clearbtn:hover{background:#d9e3ee;color:var(--navy)}
  .searchbox.has-text .clearbtn{display:flex}
  /* mini KPI cards (partner + MID views) */
  .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:18px}
  .mini .c{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 15px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
  .mini .c:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .mini .c .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .mini .c .v{font-size:19px;font-weight:700;color:var(--navy);margin-top:5px;line-height:1.15}
  .mini .c .s{font-size:11px;color:var(--muted);margin-top:3px}
  .mini .c .strip{position:absolute;left:0;top:0;bottom:0;width:4px}

  /* ===== HEADINGS ===== */
  .pagehead{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h2{font-size:19px;font-weight:700;color:var(--navy)}
  .pagehead .desc{font-size:12px;color:var(--muted)}
  .section-title{font-size:14px;font-weight:700;color:var(--navy);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .section-title:first-child{margin-top:0}

  /* ===== KPI CARDS ===== */
  .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:6px}
  .kpi{border-radius:14px;padding:16px 18px;position:relative;color:#fff;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .kpi .lab{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.85)}
  .kpi .val{font-size:23px;font-weight:800;color:#fff;margin-top:6px;line-height:1.1}
  .kpi .val .up,.kpi .val .down{color:#fff}
  .kpi .note{font-size:11.5px;color:rgba(255,255,255,.82);margin-top:5px}
  .up{color:var(--green)} .down{color:var(--red)}
  /* movers expand */
  tr.xtra{display:none}
  .card.open tr.xtra{display:table-row}
  .showall{width:100%;border:0;background:var(--grey-bg);color:var(--deep);font-weight:600;font-size:12px;padding:11px;cursor:pointer;border-top:1px solid var(--border);transition:.15s}
  .showall:hover{background:#e2eaf3}
  .moverwrap{display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:1080px){.moverwrap{grid-template-columns:1fr 1fr}}
  .delta{display:inline-flex;align-items:center;gap:5px;font-weight:700}
  .mtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:8px}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .pill.up{background:var(--green-bg)} .pill.down{background:var(--red-bg)} .pill.flat{background:var(--grey-bg);color:var(--muted)}

  /* ===== CARD / TABLE ===== */
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
  .card .ch{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .card .ch h3{font-size:14px;font-weight:700;color:var(--navy)}
  .card .ch .sub{font-size:11.5px;color:var(--muted)}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:10px 14px;text-align:left;white-space:nowrap}
  thead th{background:var(--grey-bg);color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;position:sticky;top:0}
  tbody tr{border-top:1px solid var(--border)}
  tbody tr:hover{background:#f7fafe}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .rank{width:26px;height:26px;border-radius:8px;background:var(--grey-bg);color:var(--navy);font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
  .rank.top{background:linear-gradient(135deg,var(--sky),var(--deep));color:#fff}
  .clk{cursor:pointer;color:var(--deep);font-weight:600}
  .clk:hover{text-decoration:underline}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px}
  .tag.r{background:var(--red-bg);color:var(--red)} .tag.g{background:var(--green-bg);color:var(--green)}
  .tag.a{background:var(--amber-bg);color:var(--amber)} .tag.p{background:var(--purple-bg);color:var(--purple)}
  .tag.n{background:var(--grey-bg);color:var(--muted)}

  /* ===== ANALYSIS ===== */
  .an-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .an-head .t{font-size:20px;font-weight:700;color:var(--navy)}
  .an-head .m{font-size:12px;color:var(--muted);margin-top:3px}
  .an-head .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .bignum{text-align:right}
  .bignum .v{font-size:26px;font-weight:800}
  .bignum .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .cmp{display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:900px){.cmp{grid-template-columns:1.1fr .9fr}}
  .diag{border-radius:14px;padding:16px 18px;font-size:13px;line-height:1.7}
  .diag h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .diag.why{background:var(--red-bg);border:1px solid #f6cccc}
  .diag.why h4{color:var(--red)}
  .diag.sol{background:var(--green-bg);border:1px solid #bfe7cf}
  .diag.sol h4{color:var(--green)}
  .diag.up{background:var(--green-bg);border:1px solid #bfe7cf}.diag.up h4{color:var(--green)}
  .diag ul{margin:0;padding-left:18px}
  .diag li{margin-bottom:6px}
  .diag li:last-child{margin-bottom:0}
  .changed{background:var(--amber-bg);border:1px solid #f0dcae;border-radius:10px;padding:9px 13px;font-size:12.5px;color:var(--amber);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .arrow{font-weight:700}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .backbtn{background:var(--grey-bg);border:0;border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;color:var(--deep);cursor:pointer;margin-bottom:14px}
  .backbtn:hover{background:#e2eaf3}
  .bar{height:9px;border-radius:6px;background:var(--grey-bg);overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sky),var(--deep))}
  .reslist{border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:18px}
  .resitem{padding:12px 16px;border-top:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .resitem:first-child{border-top:0}
  .resitem:hover{background:#f7fafe}
  .resitem .nm{font-weight:600;color:var(--navy)}
  .resitem .sm{font-size:11px;color:var(--muted);margin-top:2px}
  @media(max-width:760px){aside{display:none}main{padding:18px 14px}}
</style>

  .an-card{background:#fff;border:1px solid #e4ecf6;border-radius:16px;padding:18px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(11,31,63,.05)}

  .an-bar{display:flex;align-items:center;gap:12px;margin:6px 0 14px;flex-wrap:wrap}
  .an-toggle{display:inline-flex;border:1px solid #e4ecf6;border-radius:10px;overflow:hidden}
  .an-toggle button{border:0;background:#fff;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:600;color:#6b7f95;cursor:pointer}

  .an-panel{background:#fff;border:1px solid #e4ecf6;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(11,31,63,.05);margin-bottom:18px}

  .an-head h3{font-size:16px;color:#0b1f3f;font-weight:700;margin:0}
  .an-tw{max-height:460px;overflow:auto;border:1px solid #e4ecf6;border-radius:12px}
  #an-detail table{width:100%;border-collapse:collapse;font-size:12.5px}
  #an-detail th,#an-detail td{padding:9px 12px;border-bottom:1px solid #eef3f8;text-align:left;white-space:nowrap}
  #an-detail th{cursor:pointer;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#6b7f95;background:#f8fbfe;position:sticky;top:0}
  #an-detail td.num,#an-detail th.num{text-align:right}
  .an-tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
  .an-tag.inc{background:#e6f6ee;color:#16a15c}.an-tag.dec{background:#fbf0e1;color:#c07f1d}.an-tag.lost{background:#fdebeb;color:#dd4b4b}
  .st-tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .st-g{background:#e6f6ee;color:#16a15c}.st-r{background:#fdebeb;color:#dd4b4b}.st-n{background:#eef1f5;color:#5b6b7f}
  .an-btn{border:1px solid #e4ecf6;background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:12.5px;font-weight:600;color:#1c4e9d;cursor:pointer}
  .an-btn:hover{background:#f3f7fc}
  .an-btn.exp{background:#178a53;color:#fff;border-color:#178a53}.an-btn.exp:hover{background:#127043}
  .an-in,.an-sel{border:1px solid #e4ecf6;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;outline:none}
  .an-hint{font-size:12px;color:#6b7f95}
</style>
<style>/* embed: passcode removed, parent handles auth; inner sidebar hidden (parent drives tabs); keep gradient KPIs */#gate{display:none!important}#app{display:flex!important}aside{display:none!important}main{flex:1 1 auto!important;width:100%!important}</style>

<body>

<div id="gate" style="display:none" aria-hidden="true">
  <div class="box">
    <img src="https://paymentsave.co.uk/wp-content/uploads/2024/05/paymentsave-Logo-1024x224.png" alt="Paymentsave">
    <h1>Residual View</h1>
    <p>Enter the team passcode to continue</p>
    <input type="password" id="pass" placeholder="••••••••" autofocus>
    <button onclick="checkPass()">Sign in</button>
    <div class="err" id="passErr"></div>
  </div>
</div>

<div id="app" class="on">
  <aside>
    <div class="logo">
      <img src="https://paymentsave.co.uk/wp-content/uploads/2024/05/paymentsave-Logo-1024x224.png" alt="Paymentsave">
      <div class="sub">Residual View</div>
    </div>
    <nav id="nav"></nav>
    <div class="meta" id="sideMeta"></div>
  </aside>
  <main id="main"></main>
</div>

<script>document.write('<script src="resid_data.js?v='+Date.now()+'"><\/script>');</script>
<script>
/* ================= PASSCODE ================= */
const PASS_HASH="cfcba9d06239fed878cf3c855395d79dcd28aedccc924bdb21521c8c663cf64f";
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function checkPass(){
  const v=document.getElementById("pass").value;
  if(await sha256(v)===PASS_HASH){document.getElementById("gate").style.display="none";document.getElementById("app").classList.add("on");init();}
  else{document.getElementById("passErr").textContent="Incorrect passcode";document.getElementById("pass").value="";}
}
document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")checkPass();});

/* ================= DATA ================= */
let D, MIDS=[], PARTNERS=[], MBYID={};
function boot(){
  D=window.RESID; const C=D.cols;
  MIDS=D.mids.map(r=>{const o={};C.forEach((c,i)=>o[c]=r[i]);
    o.presJ=o.entJ!==""||o.earnJ!==0; o.presM=o.entM!==""||o.earnM!==0;
    o.diff=+(o.earnJ-o.earnM).toFixed(2);
    o.bpsJ=o.volJ>0?o.earnJ/o.volJ*10000:0; o.bpsM=o.volM>0?o.earnM/o.volM*10000:0;

  MIDS.forEach(m=>MBYID[m.mid]=m);
  PARTNERS=D.partners.map(p=>({name:p[0],earnJ:p[1],earnM:p[2],cntJ:p[3],cntM:p[4],diff:+(p[1]-p[2]).toFixed(2)}));

/* ================= FORMAT ================= */
const gbp=n=>"£"+Math.round(n).toLocaleString("en-GB");
const gbp2=n=>"£"+(+n).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
function money(n){const a=Math.abs(n);if(a>=1e6)return "£"+(n/1e6).toFixed(2)+"m";if(a>=1e3)return "£"+(n/1e3).toFixed(1)+"k";return "£"+n.toFixed(0);}
const pct=(a,b)=>b===0?(a>0?100:0):(a-b)/Math.abs(b)*100;
function signPct(a,b){const p=pct(a,b);const s=p>=0?"+":"";return s+p.toFixed(1)+"%";}
function esc(s){return (s==null?"":""+s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function jsq(s){return (""+s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function clearSearch(id){const i=document.getElementById(id);if(!i)return;i.value="";const b=i.closest(".searchbox");if(b)b.classList.remove("has-text");i.focus();if(id==="q"){NAV=[];const R=document.getElementById("results");if(R)R.innerHTML="";}}
function miniCards(cards){return `<div class="mini">`+cards.map(c=>`<div class="c"${c.onclick?` style="cursor:pointer" title="${c.title||'View these merchants'}" onclick="${c.onclick}"`:''}><div class="strip" style="background:${c.color||'var(--sky)'}"></div><div class="l">${c.l}${c.onclick?' <span style="opacity:.5">›</span>':''}</div><div class="v"${c.vcolor?` style="color:${c.vcolor}"`:''}>${c.v}</div>${c.s?`<div class="s">${c.s}</div>`:''}</div>`).join("")+`</div>`;}

let NAV=[];
function resultsEl(){return document.getElementById("results")||document.getElementById("dashResults");}
function navRender(){

function crumbs(){ // breadcrumb trail for context

const FUND_GRAD=["linear-gradient(135deg,#6a5ce0,#3f3bb0)","linear-gradient(135deg,#e79a52,#d1702f)","linear-gradient(135deg,#2bb0c9,#1c86a0)","linear-gradient(135deg,#2bbd77,#178a53)","linear-gradient(135deg,#d15b9e,#a83b7d)"];
const FUND_SOL=["#5a4fd0","#dd8a3e","#23a0bd","#22a86b","#c24f92","#e0a93f","#3f7fd1"];
function fundingChart(months, providers, colors){
  const P=providers.length, M=months.length;
  const padL=52,padB=30,padT=12,padR=10,H=210;
  const groupW=Math.max(58,26+P*18), plotW=M*groupW, W=padL+plotW+padR, totalH=padT+H+padB;
  let maxV=Math.max(1,...[].concat(...months.map(mo=>mo.v)));
  const pw=Math.pow(10,Math.floor(Math.log10(maxV))); maxV=Math.ceil(maxV/pw)*pw;
  let g="";
  for(let s=0;s<=4;s++){const val=maxV*s/4,y=padT+H-(H*s/4);
    g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e4ecf6" stroke-width="1"/>`;
    g+=`<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#6b7f95">£${Math.round(val).toLocaleString()}</text>`;}
  months.forEach((mo,mi)=>{
    const gx=padL+mi*groupW, barW=(groupW-16)/P;
    mo.v.forEach((v,pi)=>{const h=Math.max(0,v/maxV*H),x=gx+8+pi*barW,y=padT+H-h;
      g+=`<rect x="${(x+1).toFixed(1)}" y="${y.toFixed(1)}" width="${(barW-2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${colors[pi%colors.length]}"><title>${esc(providers[pi])} — ${esc(mo.m)}: ${gbp(v)}</title></rect>`;
      if(P===1&&v>0)g+=`<text x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1d2b3f">${money(v)}</text>`;});
    g+=`<text x="${gx+groupW/2}" y="${padT+H+16}" text-anchor="middle" font-size="10" fill="#6b7f95">${esc(mo.m)}</text>`;});
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${totalH}" width="${W}" height="${totalH}" style="max-width:100%;min-width:${Math.min(W,660)}px">${g}</svg></div>`;
}

  const mm=MIDS.filter(m=>(""+m.mid).includes(q)||(m.trading||"").toLowerCase().includes(ql)||(m.legal||"").toLowerCase().includes(ql))
    .sort((a,b)=>rankName(a.trading||a.legal,ql)-rankName(b.trading||b.legal,ql)||b.earnJ-a.earnJ);

/* ---- MID analysis ---- */
function metricRow(lab,mv,jv,fmt,goodUp=true){
  const d=jv-mv;const cls=Math.abs(d)<1e-9?"":(d>0===goodUp?"up":"down");

}
function renderMID(r){

  const volPc=pct(r.volJ,r.volM);

    {l:`${m.curLabel} residual`,v:gbp2(r.earnJ),color:"var(--deep)",s:"current month"},
    {l:`${m.prevLabel} residual`,v:gbp2(r.earnM),color:"var(--muted)",s:"prior month"},
    {l:r.diff>=0?"Increased by":"Decreased by",v:`${r.diff>=0?'+':'−'}${gbp2(Math.abs(r.diff))}`,color:r.diff>=0?"var(--green)":"var(--red)",vcolor:r.diff>=0?"var(--green)":"var(--red)",s:"£ change"},
    {l:"Change %",v:signPct(r.earnJ,r.earnM),color:r.diff>=0?"var(--green)":"var(--red)",vcolor:r.diff>=0?"var(--green)":"var(--red)",s:"vs prior month"},
    {l:"Sales volume",v:money(r.volJ),color:"var(--sky)",s:`${r.presM?signPct(r.volJ,r.volM):'new'} vs prior`},

  html+=`<tr><td>Status</td><td class="num">${esc(r.stM||'—')}</td><td class="num">${esc(r.stJ||'—')}</td><td class="num">${r.stJ!==r.stM?'<span class="tag a">changed</span>':'—'}</td></tr>`;

  html+=`</tbody></table></div></div>
    <div>
      <div class="diag ${tone}"><h4>${tone==='up'?'▲ What changed':'▼ Why it moved'}</h4><ul>${why.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="diag sol" style="margin-top:14px"><h4>✔ Recommended actions</h4><ul>${sol.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    </div></div></div>`;

function diagnoseMID(r){
  const why=[],sol=[];let tone=r.diff>=0?"up":"why";
  const volCh=pct(r.volJ,r.volM), bpsCh=r.bpsJ-r.bpsM;
  if(!r.presJ&&r.presM){
    why.push(`Merchant has <b>no June record</b> — it left the datagrid. The full ${gbp2(r.earnM)} May residual is lost this month.`);
    why.push(`Common causes: account closed, switched acquirer, or terminal not transacting / not yet re-loaded.`);
    sol.push(`Confirm the closure reason with <b>${esc(r.partner||'the partner')}</b> — closed vs. churned vs. data lag.`);
    sol.push(`If churned to a competitor, flag for win-back; if reboarded under a new entity, link the replacement MID so the residual is recaptured.`);
    return {why,sol,tone:"why"};
  }
  if(r.presJ&&!r.presM){
    why.push(`<b>New merchant</b> in ${D.meta.curLabel} — no ${D.meta.prevLabel} baseline. Added ${gbp2(r.earnJ)} to the book.`);
    why.push(`Volume ${money(r.volJ)} at a ${r.bpsJ.toFixed(1)} bps yield.`);
    sol.push(`Onboarding is healthy — monitor next month to confirm the merchant keeps transacting.`);
    return {why,sol,tone:"up"};
  }
  // both present
  if(r.diff>=0){
    if(volCh>3)why.push(`Sales volume rose <b>${signPct(r.volJ,r.volM)}</b> (${money(r.volM)} → ${money(r.volJ)}); at ~${r.bpsJ.toFixed(1)} bps this lifted the residual.`);
    if(bpsCh>0.2)why.push(`Effective yield improved from ${r.bpsM.toFixed(1)} to ${r.bpsJ.toFixed(1)} bps — better margin / mix or a rate change.`);
    if(!why.length)why.push(`Residual up ${gbp2(r.diff)} on broadly stable volume — minor mix/rate movement.`);
    sol.push(`No action needed. ${esc(r.partner||'Partner')} performing well — good candidate to reference for similar merchants.`);
    return {why,sol,tone:"up"};
  }
  // decline
  if(r.entChg){
    why.push(`<b>Entity code changed ${esc(r.entM)} → ${esc(r.entJ)}.</b> A move to a different acquiring entity can reset pricing tier or your revenue-share and is a frequent cause of a sudden residual drop.`);
    sol.push(`Reconcile the old and new entity MIDs; confirm revenue-share % carried over and the merchant wasn’t re-tiered.`);
  }
  const boLost=/not\s*trans/i.test(r.boJ)&&!/not\s*trans/i.test(r.boM);
  if(boLost){why.push(`Back-office stage moved to <b>“${esc(r.boJ)}”</b> — the merchant stopped transacting mid-period, cutting billable volume.`);
    sol.push(`Check the terminal is live; chase reactivation via ${esc(r.partner||'the partner')} if the merchant is still trading.`);}
  if(volCh<-5){
    const volPart=r.volM>0?(r.volM-r.volJ)*r.bpsM/10000:0;
    why.push(`Sales volume fell <b>${signPct(r.volJ,r.volM)}</b> (${money(r.volM)} → ${money(r.volJ)}); at ${r.bpsM.toFixed(1)} bps that alone accounts for about ${gbp2(volPart)} of the drop.`);
    sol.push(`Assess whether the dip is seasonal or a genuine decline — if volume is down 2+ months, have ${esc(r.partner||'the partner')} engage the merchant.`);
  }
  if(bpsCh<-0.3){
    why.push(`Effective yield fell from ${r.bpsM.toFixed(1)} to ${r.bpsJ.toFixed(1)} bps — margin compression. Since April, Elavon deducts card-scheme fees from residual rows (~2.4% of residual), and a buy-rate/MSC change can add to this.`);
    sol.push(`Review the merchant’s pricing — a small MSC uplift or buy-rate renegotiation restores the eroded margin.`);
  }
  if(!why.length)why.push(`Residual down ${gbp2(Math.abs(r.diff))} with volume broadly flat — small rate/mix and scheme-fee effects.`);
  if(!sol.length)sol.push(`Monitor next month; if the decline persists, review pricing and trading status with ${esc(r.partner||'the partner')}.`);
  return {why,sol,tone:"why"};
}

/* ---- Partner analysis ---- */
function renderPartner(p){
  const rows=MIDS.filter(m=>m.partner===p.name);
  const down=rows.filter(m=>m.diff<-0.005).sort((a,b)=>a.diff-b.diff);
  const up=rows.filter(m=>m.diff>0.005);
  const lost=rows.filter(m=>!m.presJ&&m.presM);
  const gained=rows.filter(m=>m.presJ&&!m.presM);

function partnerMidsTable(name,cat){

      <td class="num">${r.presM?gbp2(r.earnM):'—'}</td><td class="num">${r.presJ?gbp2(r.earnJ):'—'}</td><td class="num">${diffPill(r.diff)}</td>
      <td>${r.entChg?`<span class="tag a">${esc(r.entM)}→${esc(r.entJ)}</span>`:esc(r.entJ||r.entM||'—')}</td>

function diagnosePartner(p,x){
  const why=[],sol=[];
  if(p.diff>=0){
    why.push(`Book grew <b>${gbp(p.diff)}</b> (${signPct(p.earnJ,p.earnM)}) to ${gbp(p.earnJ)}.`);
    if(x.gained.length)why.push(`${x.gained.length} new merchant${x.gained.length>1?'s':''} added ${gbp(x.gained.reduce((s,m)=>s+m.diff,0))}.`);
    if(x.up.length)why.push(`${x.up.length} merchants grew, ${x.down.length} declined.`);
    sol.push(`Momentum is positive — keep feeding this partner leads and use them as a benchmark.`);
    if(x.entc.length)sol.push(`${x.entc.length} entity-code change${x.entc.length>1?'s':''} in the book — spot-check pricing carried over.`);
    return {why,sol};
  }
  why.push(`Book fell <b>${gbp(Math.abs(p.diff))}</b> (${signPct(p.earnJ,p.earnM)}) to ${gbp(p.earnJ)}.`);
  if(x.lost.length)why.push(`<b>${x.lost.length} MID${x.lost.length>1?'s':''} dropped out</b> of the June datagrid — ${gbp(Math.abs(x.lostSum))} of the fall. Largest: ${x.lost.slice(0,3).map(m=>esc(m.trading||m.legal)).join(", ")}.`);
  if(x.declSum<-0.005)why.push(`Continuing merchants declined a net ${gbp(Math.abs(x.declSum))} — volume dips and margin/scheme-fee erosion.`);
  if(x.entc.length)why.push(`${x.entc.length} merchant${x.entc.length>1?'s':''} changed entity code — possible re-tiering / revenue-share reset.`);
  if(x.down.length)why.push(`${x.down.length} of ${x.rows.length} MIDs down vs ${x.up.length} up.`);
  if(x.lost.length)sol.push(`Chase the ${x.lost.length} lost MID${x.lost.length>1?'s':''} first — biggest recovery. Confirm closed vs churned vs data-lag with the partner.`);
  if(x.entc.length)sol.push(`Reconcile the entity-changed MIDs against replacement accounts to recapture residual.`);
  sol.push(`Share the decline list with ${esc(p.name)} and agree win-back / reactivation actions on the top droppers.`);
  return {why,sol};
}

let PA=null;

function computeAnalytics(){
  if(PA)return PA;
  const map={};
  function ent(name){if(!map[name])map[name]={name:name,inc:{n:0,v:0},dec:{n:0,v:0},lost:{n:0,v:0},rows:[]};return map[name];}
  MIDS.forEach(function(m){
    const name=m.partner||"—"; let cat=null, delta=+(m.earnJ-m.earnM).toFixed(2);
    if(m.presM&&!m.presJ){cat="lost";delta=-(+m.earnM);}
    else if(m.presJ&&m.presM){if(m.earnJ>m.earnM)cat="inc";else if(m.earnJ<m.earnM)cat="dec";}
    if(!cat)return;
    const e=ent(name);
    if(cat==="inc"){e.inc.n++;e.inc.v+=delta;}
    else if(cat==="dec"){e.dec.n++;e.dec.v+=delta;}
    else{e.lost.n++;e.lost.v+=delta;}
    e.rows.push({mid:m.mid,trading:m.trading,legal:m.legal,prev:+m.earnM,cur:+m.earnJ,delta:delta,cat:cat,
      vJ:+m.volJ||0,vM:+m.volM||0,tJ:+m.trxJ||0,tM:+m.trxM||0,boJ:m.boJ||"",entJ:m.entJ||"",entM:m.entM||""});
  });
  PA=Object.keys(map).map(function(k){var p=map[k];p.total=p.inc.n+p.dec.n+p.lost.n;p.net=+(p.inc.v+p.dec.v+p.lost.v).toFixed(2);return p;})
     .filter(function(p){return p.total>0;});
  return PA;
}

function anReasonInfo(r){
  const vJ=+r.vJ||0, vM=+r.vM||0;
  const notTrans=/not/i.test(String(r.boJ||""));
  const volPct=vM>0?((vJ-vM)/vM*100):(vJ>0?100:0);
  const planChg=r.entJ!==""&&r.entM!==""&&String(r.entJ)!==String(r.entM);
  if(r.cat==="lost") return (vJ===0||notTrans)?{k:"stopped",t:"Stopped transacting — no card volume this month"}:{k:"none",t:"No residual recorded this month"};
  if(r.cat==="dec"){
    if(vJ===0&&vM>0) return {k:"stopped",t:"Stopped transacting — no card volume"};
    if(notTrans) return {k:"nottrans",t:"Flagged not transacting"};
    if(volPct<=-2) return {k:"voldown",t:"Lower card turnover ("+volPct.toFixed(0)+"% volume)"};
    if(planChg) return {k:"plan",t:"Pricing / plan change"};
    return {k:"scheme",t:"Scheme fees / rate mix (volume ~steady)"};
  }
  if(r.cat==="inc"){
    if(vM===0&&vJ>0) return {k:"started",t:"Started / resumed transacting"};
    if(volPct>=2) return {k:"volup",t:"Higher card turnover (+"+volPct.toFixed(0)+"% volume)"};
    if(planChg) return {k:"plan",t:"Pricing / plan change"};
    return {k:"bettermix",t:"Better rate mix (volume ~steady)"};
  }
  return {k:"none",t:"—"};
}

function anReasonCat(r){return anReasonInfo(r).k;}

function anExport(){
  if(typeof XLSX==="undefined"){alert("Excel library still loading — try again in a moment.");return;}
  const CN={inc:"Increased",dec:"Decreased",lost:"Lost"};
  const data=(AN._rows||[]).map(function(r){var o={};o.MID=r.mid;o.Trading=r.trading;o.Legal=r.legal;
    o[D.meta.prevLabel]=+(+r.prev).toFixed(2);o[D.meta.curLabel]=+(+r.cur).toFixed(2);o.Change=+(+r.delta).toFixed(2);o.Category=CN[r.cat];o["Last Batch"]=lastBatch(r.mid);o["MID Status"]=midStatus(r.mid);o.Reason=anReason(r);return o;});
  const ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Partner Analytics");
  XLSX.writeFile(wb,("Partner Analytics - "+(AN.partner||"all")+".xlsx").replace(/[\\/:*?"<>|]/g,"_"));
}
